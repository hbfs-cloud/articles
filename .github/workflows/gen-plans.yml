name: Generate Trading Plans

on:
  # After scanner pushes new signals/orders
  push:
    branches: [main]
    paths:
      - 'portfolio/v1/*/orders.json'
      - 'portfolio/v1/*/signals.json'
  # Daily safety net — 07:00 UTC (3h before Convex cron at 10:00)
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gen-plans
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect plan date
        id: date
        run: |
          # Use scanDate from orders.json if available, else next biz day
          SCAN_DATE=$(node -e "
            const fs = require('fs');
            try {
              const o = JSON.parse(fs.readFileSync('portfolio/v1/balanced/orders.json','utf8'));
              if (o.scanDate) { console.log(o.scanDate.replace(/-/g,'')); process.exit(); }
            } catch(_) {}
            const d = new Date();
            const h = d.getUTCHours();
            if (h >= 21) d.setUTCDate(d.getUTCDate() + 1);
            // Skip weekends
            while (d.getDay() === 0 || d.getDay() === 6) d.setUTCDate(d.getUTCDate() + 1);
            console.log(d.toISOString().slice(0,10).replace(/-/g,''));
          ")
          echo "date=$SCAN_DATE" >> $GITHUB_OUTPUT
          echo "Plan date: $SCAN_DATE"

      - name: Generate plans for all modes × brokers
        run: |
          MODES=$(node -e "const c=require('./data/modes-config.json');console.log(Object.entries(c.modes).filter(([,v])=>!['draft','stopped'].includes(v.status)).map(([k])=>k).join(' '))")
          for mode in $MODES; do
            for broker in paper alpaca t212; do
              node tools/gen-trading-plan.js --mode "$mode" --broker "$broker" --date "${{ steps.date.outputs.date }}" || true
            done
          done
          echo "Generated plans:"
          ls -la data/trading-plans/*${{ steps.date.outputs.date }}* 2>/dev/null || echo "No new plans"

      - name: Commit and push plans
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trading-plans/
          if git diff --cached --quiet; then
            echo "No new plans to commit"
          else
            git commit -m "chore: auto-generate trading plans for ${{ steps.date.outputs.date }}"
            git push
          fi

      - name: Build public site
        run: |
          mkdir -p _site

          # Root public files
          cp -f index.html 404.html CNAME robots.txt sitemap.xml feed.xml sw.js manifest.json logo.svg _site/ 2>/dev/null || true
          cp -f favicon.ico favicon-*.png apple-touch-icon.png _site/ 2>/dev/null || true
          cp -f icon-*.png scanner-daily-card.html scanner-daily-*.png _site/ 2>/dev/null || true

          # Static assets (CSS + JS)
          cp -r assets/ _site/assets/

          # Article directories + public apps
          for dir in daily weekly scanner analyses series tech prompt-ia; do
            [ -d "$dir" ] && cp -r "$dir" "_site/$dir"
          done

          # Data (JSON indexes + search + trading plans)
          mkdir -p _site/data
          cp -f data/*.json data/*.js _site/data/ 2>/dev/null || true
          [ -d data/trading-plans ] && cp -r data/trading-plans _site/data/trading-plans

          # Portfolio API (all modes + root endpoints)
          cp -r portfolio/ _site/portfolio/

          # Widget system
          cp -r widget/ _site/widget/

          # MCP public files only (NOT server/, extension/, validation/, data/)
          mkdir -p _site/mcp
          cp -f mcp/index.html mcp/watchlist.json mcp/earnings-calendar.json mcp/scanner-performance.json _site/mcp/ 2>/dev/null || true

          # Integrations docs
          [ -d integrations ] && cp -r integrations/ _site/integrations/

          echo "Site built: $(find _site -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
