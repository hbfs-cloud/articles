name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the Yahoo close fallback after every US trading day.
    - cron: '30 23 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public site
        run: |
          node tools/build-marketwatch-data.js
          node tools/build-marketwatch-yahoo-closes.js
          mkdir -p _site

          # Root public files
          cp -f index.html 404.html CNAME robots.txt sitemap.xml feed.xml sw.js manifest.json logo.svg _site/ 2>/dev/null || true
          cp -f favicon.ico favicon-*.png apple-touch-icon.png _site/ 2>/dev/null || true
          cp -f icon-*.png scanner-daily-card.html scanner-daily-*.png _site/ 2>/dev/null || true

          # Static assets (CSS + JS)
          cp -r assets/ _site/assets/

          # Article directories + public apps
          # Research runs are versioned evidence, not approved public articles.
          for dir in daily weekly scanner analyses series tech prompt-ia rotation marketwatch; do
            [ -d "$dir" ] && rsync -a --exclude='_runs/' "$dir/" "_site/$dir/"
          done

          # Data (JSON indexes + search + trading plans)
          mkdir -p _site/data
          cp -f data/*.json data/*.js _site/data/ 2>/dev/null || true
          [ -d data/trading-plans ] && cp -r data/trading-plans _site/data/trading-plans

          # Published dossiers with a provenance sidecar, plus their review records.
          mkdir -p _site/data/analyses-data _site/data/analyses-evidence
          for evidence in data/analyses-evidence/*.json; do
            [ -f "$evidence" ] || continue
            ticker="$(basename "$evidence" .json)"
            [ -f "analyses/$ticker/index.html" ] || continue
            cp -f "$evidence" _site/data/analyses-evidence/
            cp -f "data/analyses-data/$ticker.json" _site/data/analyses-data/
          done
          [ -d data/analysis-editorial-reviews ] && cp -r data/analysis-editorial-reviews _site/data/

          # Portfolio API (all modes + root endpoints)
          cp -r portfolio/ _site/portfolio/

          # Widget system
          cp -r widget/ _site/widget/

          # MCP public files only (NOT server/, extension/, validation/, data/)
          mkdir -p _site/mcp
          cp -f mcp/index.html mcp/watchlist.json mcp/earnings-calendar.json mcp/scanner-performance.json _site/mcp/ 2>/dev/null || true

          # Integrations docs
          [ -d integrations ] && cp -r integrations/ _site/integrations/

          echo "Site built: $(find _site -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
