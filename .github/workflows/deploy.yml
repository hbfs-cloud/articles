name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public site
        run: |
          mkdir -p _site

          # Root public files
          cp -f index.html 404.html CNAME robots.txt sitemap.xml feed.xml sw.js manifest.json logo.svg _site/ 2>/dev/null || true
          cp -f favicon.ico favicon-*.png apple-touch-icon.png _site/ 2>/dev/null || true
          cp -f icon-*.png scanner-daily-card.html scanner-daily-*.png _site/ 2>/dev/null || true

          # Static assets (CSS + JS)
          cp -r assets/ _site/assets/

          # Article directories + public apps. Evidence/work directories use
          # an underscore prefix and are deliberately absent from Pages.
          for dir in daily weekly scanner analyses series tech prompt-ia rotation; do
            if [ -d "$dir" ]; then
              mkdir -p "_site/$dir"
              rsync -a --exclude='_*' --exclude='harness.json' "$dir/" "_site/$dir/"
            fi
          done

          # Public data only. Canonical execution state, notification queues and
          # withdrawn pre-capacity backtests stay in git for the pipeline but
          # must never be copied into the Pages artifact.
          mkdir -p _site/data
          for file in data/*.json data/*.js; do
            [ -f "$file" ] || continue
            case "$(basename "$file")" in
              backtest-results.json|backtest-trades.json|enriched-trades.json|portfolio-history.json|rolling-walk-forward.json|trade-chain.json) continue ;;
              pit-forward.json|pit-results.json|pit-state.json|dtx-engine-history.json|dtx-live-track.json|dtx-sleeve-exits.json) continue ;;
              capacity-ledger-v1.json|iso-alignment.json|modes-config-history.json|risk-snapshots.json|scanner-metrics.json|scanner-positions.json|modes-status-history.json) continue ;;
              broker-instruments.json|executor-allowlist.json|routines-manifest.json|scanner-heartbeat.json|scanner-notifications.json|signal-alerts-pending.json|signal-monitor-state.json|signals-ledger.json|signals-telegram-messages.json) continue ;;
            esac
            cp -f "$file" _site/data/
          done

          # Portfolio API (all modes + root endpoints)
          cp -r portfolio/ _site/portfolio/

          # Widget system
          cp -r widget/ _site/widget/

          # MCP public files only (NOT server/, extension/, validation/, data/)
          mkdir -p _site/mcp
          cp -f mcp/index.html mcp/watchlist.json mcp/earnings-calendar.json mcp/scanner-performance.json _site/mcp/ 2>/dev/null || true

          # Integrations docs
          [ -d integrations ] && cp -r integrations/ _site/integrations/

          echo "Site built: $(find _site -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
