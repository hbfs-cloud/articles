# Production compose for the Oracle VM. Secrets are injected from the secret store (Infisical),
# NOT written here. Example uses env_file that lives OUTSIDE git on the VM.
services:
  substack-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dailytickers/substack-mcp:latest
    restart: unless-stopped
    # env_file is provisioned on the VM by Infisical / the deploy step — never committed.
    env_file:
      - /etc/substack-mcp/env
    expose:
      - "8080"
    networks:
      - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
