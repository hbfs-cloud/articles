<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyTickers AutoTrader — PRD Specifications</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --sidebar-w: 300px;
  --brand: #0f172a;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --bg: #f8fafc;
  --sidebar-bg: #fff;
  --border: #e2e8f0;
  --text: #334155;
  --text-muted: #64748b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); }

.layout { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--sidebar-bg);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; overflow: hidden;
}
.sidebar-header {
  padding: 1.25rem 1rem; border-bottom: 1px solid var(--border);
  background: var(--brand); color: #fff;
}
.sidebar-header h1 { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
.sidebar-header p { font-size: 0.7rem; color: #94a3b8; margin-top: 0.25rem; }
.sidebar-search {
  padding: 0.75rem 1rem; border-bottom: 1px solid var(--border);
}
.sidebar-search input {
  width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border);
  border-radius: 6px; font-size: 0.8rem; outline: none; background: var(--bg);
}
.sidebar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
.nav-section { padding: 0.5rem 1rem 0.25rem; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
.nav-item {
  display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.5rem 1rem;
  cursor: pointer; font-size: 0.8rem; color: var(--text); text-decoration: none;
  border-left: 3px solid transparent; transition: all 0.15s;
}
.nav-item:hover { background: var(--bg); color: var(--accent); }
.nav-item.active { background: var(--accent-light); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.nav-item .nav-num { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); min-width: 1.5rem; padding-top: 0.1rem; }
.nav-item .nav-title { flex: 1; line-height: 1.3; }
.nav-item .nav-badge {
  font-size: 0.6rem; padding: 0.1rem 0.4rem; border-radius: 9px;
  background: var(--accent-light); color: var(--accent); font-weight: 600; white-space: nowrap;
}

.main { flex: 1; margin-left: var(--sidebar-w); }
.main-header {
  position: sticky; top: 0; z-index: 5; background: rgba(248,250,252,0.9);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  padding: 0.75rem 2rem; display: flex; align-items: center; justify-content: space-between;
}
.breadcrumb { font-size: 0.8rem; color: var(--text-muted); }
.breadcrumb strong { color: var(--text); }
.header-actions { display: flex; gap: 0.5rem; }
.header-actions button {
  padding: 0.4rem 0.8rem; font-size: 0.75rem; border: 1px solid var(--border);
  border-radius: 6px; background: #fff; cursor: pointer; color: var(--text);
}
.header-actions button:hover { border-color: var(--accent); color: var(--accent); }

.content { padding: 2rem; max-width: 900px; margin: 0 auto; }
.markdown-body { font-size: 0.9rem; line-height: 1.7; }
.markdown-body h1 { font-size: 1.6rem; border-bottom: 2px solid var(--accent); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
.markdown-body h2 { font-size: 1.25rem; margin-top: 2rem; color: var(--brand); }
.markdown-body h3 { font-size: 1.05rem; margin-top: 1.5rem; }
.markdown-body table { font-size: 0.8rem; }
.markdown-body code { font-size: 0.8rem; background: #f1f5f9; padding: 0.15rem 0.35rem; border-radius: 4px; }
.markdown-body pre { background: #1e293b !important; color: #e2e8f0; border-radius: 8px; padding: 1rem; overflow-x: auto; }
.markdown-body pre code { background: none; color: inherit; padding: 0; }
.markdown-body blockquote { border-left: 4px solid var(--accent); background: var(--accent-light); padding: 0.75rem 1rem; border-radius: 0 8px 8px 0; }

.welcome { text-align: center; padding: 4rem 2rem; }
.welcome h2 { font-size: 1.5rem; color: var(--brand); margin-bottom: 1rem; }
.welcome p { color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem; line-height: 1.6; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; max-width: 600px; margin: 0 auto 2rem; }
.stat-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
.stat-card .sv { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
.stat-card .sl { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem; }

.toc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0.75rem; max-width: 800px; margin: 0 auto; text-align: left; }
.toc-card {
  background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1rem;
  cursor: pointer; transition: all 0.15s; text-decoration: none; color: var(--text);
}
.toc-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(37,99,235,0.1); transform: translateY(-1px); }
.toc-card .tc-num { font-size: 0.65rem; font-weight: 700; color: var(--accent); }
.toc-card .tc-title { font-size: 0.85rem; font-weight: 600; margin: 0.25rem 0; }
.toc-card .tc-desc { font-size: 0.7rem; color: var(--text-muted); line-height: 1.4; }

.mobile-toggle {
  display: none; position: fixed; bottom: 1rem; left: 1rem; z-index: 20;
  width: 44px; height: 44px; border-radius: 50%; background: var(--accent);
  color: #fff; border: none; font-size: 1.2rem; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.2s; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .mobile-toggle { display: flex; align-items: center; justify-content: center; }
  .content { padding: 1rem; }
}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>AutoTrader PRD</h1>
      <p>DailyTickers Trading SaaS Specs</p>
    </div>
    <div class="sidebar-search">
      <input type="text" id="searchInput" placeholder="Search specs...">
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <main class="main">
    <header class="main-header">
      <div class="breadcrumb" id="breadcrumb">specs / <strong>overview</strong></div>
      <div class="header-actions">
        <button onclick="loadSpec('_index')">Overview</button>
        <button onclick="printSpec()">Print</button>
      </div>
    </header>
    <div class="content">
      <div class="markdown-body" id="content"></div>
    </div>
  </main>
</div>

<button class="mobile-toggle" id="mobileToggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<script>
const SPECS = [
  { id: '00-overview', num: '00', title: 'System Overview & Architecture', section: 'Foundation', badge: 'ARCH', desc: 'High-level architecture, domain boundaries, deployment model' },
  { id: '01-market-data', num: '01', title: 'Market Data Collection', section: 'Data Pipeline', badge: 'DATA', desc: 'MCP gateway integration, screeners, real-time quotes' },
  { id: '02-signal-generation', num: '02', title: 'Signal Generation Engine', section: 'Data Pipeline', badge: 'SIGNAL', desc: 'Scoring, validation, anti-dilution, sharia compliance' },
  { id: '03-risk-management', num: '03', title: 'Risk Management Layer', section: 'Data Pipeline', badge: 'RISK', desc: 'Regime detection, correlation, VaR, sizing, circuit breakers' },
  { id: '04-portfolio-simulation', num: '04', title: 'Portfolio Simulation Engine', section: 'Core Engine', badge: 'SIM', desc: 'Sweep backtest, modes, grid search, equity tracking' },
  { id: '05-position-tracking', num: '05', title: 'Position Tracking & Exits', section: 'Core Engine', badge: 'TRACK', desc: 'Live price tracking, exit triggers, MtM valuation' },
  { id: '06-order-execution', num: '06', title: 'Order Execution Engine', section: 'Core Engine', badge: 'EXEC', desc: 'Plan generation, engine lifecycle, bracket orders' },
  { id: '07-broker-adapters', num: '07', title: 'Multi-Broker Adapter Layer', section: 'Integrations', badge: 'BROKER', desc: 'Adapter interface, Alpaca/IBKR/Saxo/T212/Binance/Paper' },
  { id: '08-instrument-registry', num: '08', title: 'Instrument Registry & Mapping', section: 'Integrations', badge: 'INST', desc: 'Cross-broker symbol mapping, ISIN/UIC, tradability' },
  { id: '09-notifications', num: '09', title: 'Notification & Reporting', section: 'Integrations', badge: 'NOTIF', desc: 'Telegram, Discord, mode cards, daily card image' },
  { id: '10-api-layer', num: '10', title: 'Public API Layer', section: 'Platform', badge: 'API', desc: '50+ JSON endpoints, portfolio API, risk snapshots' },
  { id: '11-dashboard-ui', num: '11', title: 'Dashboard & Live UI', section: 'Platform', badge: 'UI', desc: 'Status page, live engine, time machine, equity charts' },
  { id: '12-mcp-orchestration', num: '12', title: 'MCP Orchestration Layer', section: 'Platform', badge: 'MCP', desc: 'DailyTickers MCP gateway, tool routing, caching' },
  { id: '13-mode-configuration', num: '13', title: 'Mode Configuration System', section: 'Core Engine', badge: 'MODE', desc: '6 modes, regime filters, parameter tuning, recalibration' },
  { id: '14-user-management', num: '14', title: 'User & Subscription Management', section: 'SaaS', badge: 'USER', desc: 'Multi-tenant, auth, broker linking, plan selection' },
  { id: '15-scheduler', num: '15', title: 'Scheduler & Pipeline Orchestrator', section: 'SaaS', badge: 'SCHED', desc: 'Cron jobs, pipeline DAG, retry, health checks' },
  { id: '16-qa-validation', num: '16', title: 'QA & Validation Framework', section: 'SaaS', badge: 'QA', desc: 'Pre-publish checks, data integrity, regression tests' },
  { id: '17-strategy-discovery', num: '17', title: 'Strategy Discovery & Research', section: 'Research', badge: 'STRAT', desc: 'Backtesting, grid search, walk-forward, strategy lab' },
  { id: '18-security-access-control', num: '18', title: 'Security & Access Control', section: 'Security', badge: 'SEC', desc: 'API security, MCP access, credential encryption, audit' },
  { id: '19-shared-market-data', num: '19', title: 'Shared Market Data Layer', section: 'Infrastructure', badge: 'CACHE', desc: 'Mutualized data access, multi-tier cache, quote aggregator' },
  { id: '20-mcp-strategy-analysis', num: '20', title: 'MCP Server — Strategy Analysis', section: 'MCP Servers', badge: 'MCP-S', desc: 'Backtest, optimize, compare strategies via MCP protocol' },
  { id: '21-mcp-user-facing', num: '21', title: 'MCP Server — User Facing', section: 'MCP Servers', badge: 'MCP-U', desc: 'Portfolio queries, trade explanations, alerts via MCP' },
  { id: '22-notification-hub', num: '22', title: 'Multi-Channel Notification Hub', section: 'Infrastructure', badge: 'NOTIF', desc: 'Slack, Telegram, Discord, email, webhooks, routing' },
  { id: '23-mechanical-strategy-integration', num: '23', title: 'Unified Strategy Engine', section: 'Research', badge: 'ENGINE', desc: 'Strategy interface, StrategySlot, Go bridge (stdio JSON-RPC), 60+ scanners, hierarchical risk, plugin arch' },
  { id: '24-analytical-data-layer', num: '24', title: 'Analytical Data Layer', section: 'Research', badge: 'OLAP', desc: 'Cube.dev-like semantic layer, dbt-style transforms (staging → marts), 6 cubes, QueryAnalytics MCP tools, strategy discovery' },
  { id: '25-ai-first-skills-architecture', num: '25', title: 'AI-First Skills Architecture', section: 'AI-First', badge: 'SKILLS', desc: 'Skills catalog (oz-skills format), CLAUDE.md per module, .mcp.json, agentic design patterns, plugin architecture' },
  { id: 'PROMPT', num: '##', title: 'Master Implementation Prompt', section: 'Foundation', badge: 'PROMPT', desc: 'Full build prompt for LLM agent — reading order, rules, pipeline DAG' },
];

let currentSpec = null;
const cache = {};

function buildNav() {
  const nav = document.getElementById('sidebarNav');
  let currentSection = '';
  let html = '';
  for (const s of SPECS) {
    if (s.section !== currentSection) {
      currentSection = s.section;
      html += `<div class="nav-section">${currentSection}</div>`;
    }
    html += `<a class="nav-item" data-id="${s.id}" onclick="loadSpec('${s.id}')">
      <span class="nav-num">${s.num}</span>
      <span class="nav-title">${s.title}</span>
      <span class="nav-badge">${s.badge}</span>
    </a>`;
  }
  nav.innerHTML = html;
}

async function loadSpec(id) {
  if (id === '_index') { showWelcome(); return; }
  const spec = SPECS.find(s => s.id === id);
  if (!spec) return;

  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  document.getElementById('breadcrumb').innerHTML = `specs / <strong>${spec.title}</strong>`;
  document.getElementById('sidebar').classList.remove('open');

  const el = document.getElementById('content');
  if (cache[id]) { el.innerHTML = cache[id]; currentSpec = id; return; }

  el.innerHTML = '<p style="color:#64748b;padding:2rem;">Loading...</p>';
  try {
    const res = await fetch(`${id}.md`);
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    const html = marked.parse(md);
    cache[id] = html;
    el.innerHTML = html;
    currentSpec = id;
  } catch (e) {
    el.innerHTML = `<div style="padding:2rem;text-align:center;color:#64748b;">
      <p style="font-size:1.5rem;margin-bottom:1rem;">📄</p>
      <p><strong>${spec.title}</strong></p>
      <p style="font-size:0.8rem;margin-top:0.5rem;">File <code>${id}.md</code> not found yet.</p>
    </div>`;
  }
}

function showWelcome() {
  currentSpec = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('breadcrumb').innerHTML = 'specs / <strong>overview</strong>';
  const sections = {};
  SPECS.forEach(s => { if (!sections[s.section]) sections[s.section] = []; sections[s.section].push(s); });
  let cards = '';
  for (const s of SPECS) {
    cards += `<a class="toc-card" onclick="loadSpec('${s.id}')">
      <div class="tc-num">PRD-${s.num}</div>
      <div class="tc-title">${s.title}</div>
      <div class="tc-desc">${s.desc}</div>
    </a>`;
  }
  document.getElementById('content').innerHTML = `<div class="welcome">
    <h2>DailyTickers AutoTrader</h2>
    <p>Complete PRD specifications for the automated trading SaaS platform. N modes × X brokers, fully automated pipeline from scanner signals to executed orders.</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="sv">${SPECS.length}</div><div class="sl">PRD Documents</div></div>
      <div class="stat-card"><div class="sv">6</div><div class="sl">Trading Modes</div></div>
      <div class="stat-card"><div class="sv">6</div><div class="sl">Broker Adapters</div></div>
      <div class="stat-card"><div class="sv">50+</div><div class="sl">API Endpoints</div></div>
    </div>
    <div class="toc-grid">${cards}</div>
  </div>`;
}

function printSpec() { window.print(); }

document.getElementById('searchInput').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el => {
    const title = el.querySelector('.nav-title').textContent.toLowerCase();
    el.style.display = !q || title.includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.nav-section').forEach(el => {
    let next = el.nextElementSibling;
    let hasVisible = false;
    while (next && !next.classList.contains('nav-section')) {
      if (next.style.display !== 'none') hasVisible = true;
      next = next.nextElementSibling;
    }
    el.style.display = hasVisible || !q ? '' : 'none';
  });
});

buildNav();
showWelcome();
</script>
</body>
</html>
