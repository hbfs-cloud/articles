portfolios:
- id: jp
  name: Japan Recovery Strategy
  currency: JPY
  initial_capital: 10000000

  allocations:
  - name: jp
    region: JP
    currency: JPY
    percent: 100
    max_open_positions: 25   # GA seed42 port: 30→25
    stocks: true
    etfs: false
    pure: false
    min_market_cap: 50_000_000_000
    min_volume: 0
    broker: ""
    strategy: jp-recovery

    # Smooth start at launch (live insurance).
    smooth_start_days: 20
    smooth_start_initial_pct: 0.50
    pending_buy_cancel_days: 1
    min_cash_reserve: 10
    regime_tickers:
      index: "^N225"
      volatility: "^VIX"
      vol_neutral: 20.0
      vol_range: 8.0
      vol_risk_off: 35.0
      vol_early_ro: 28.0
      vol_exit_ro: 25.0
      vol_exit_early_ro: 22.0
    # Moderate per-position loss limits
    dynamic_max_loss:
      risk_on: 0.15
      recovery: 0.15
      neutral: 0.12
      early_risk_off: 0.10
      risk_off: 0.08
    # JP position limits - AGGRESSIVE for CAGR
    # Scanner applies stricter filters per regime
    # GA seed42 port (2026-07-09): max_open_positions 30→25 clamps ero/roff 30→25;
    # neutral 20→25. Full-period 18.33%/DD15.79/Sh1.23/R2 0.95/WR54.4 (STABLE plateau,
    # beats deployed baseline 15.55%/DD17.06/Sh1.05 on every axis, CAGR>DD).
    dynamic_max_positions:
      risk_on: 0        # BLOCKED in scanner
      recovery: 0       # BLOCKED in scanner
      neutral: 25       # GA: 20→25
      early_risk_off: 25 # GA: clamped 30→25 by max_open_positions=25
      risk_off: 25      # GA: clamped 30→25 by max_open_positions=25
    dynamic_timeout:
      risk_on: 14
      recovery: 14
      neutral: 14
      early_risk_off: 14
      risk_off: 14
    # Tighter stops to reduce DD
    dynamic_base_stop_atr:
      risk_on: 1.8
      recovery: 1.8
      neutral: 1.5
      early_risk_off: 1.3
      risk_off: 1.2
    # JP scanner filters - AGGRESSIVE for CAGR
    # BEST COMBO: EARLY_RO + RSI<35 = 61.1% WR, n=27K
    scanner_filters:
      # Point-in-time survivorship / look-ahead gate. JPY threshold ≈ $5M (150 JPY/USD).
      # Honest CAGR with gate: 14.4% (vs 16% biased).
      min_established_dollar_volume: 750_000_000
      established_lookback_days: 60
      max_dist_ma20: -0.01   # GA seed42: -0.03→-0.01
      min_rsi: 10            # Allow deeply oversold
      max_rsi: 45            # GA seed42: 35→45
      min_atr_pct: 0.025     # GA seed42: 0.02→0.025
      max_atr_ratio: 0.175   # GA seed42: 0.15→0.175
      min_vol_ratio: 0.5     # Very relaxed for more trades
      min_score: 55          # GA seed42: 45→55
      skip_regimes: [RECOVERY, RISK_ON]  # These have negative returns
    # PM parameters - AGGRESSIVE
    # PeakReturn avg=8.4% → take_profit=10%
    # Stop rate 35% → keep 2xATR but trail faster
    base_stop_atr: 2.2       # GA seed42: 2.0→2.2
    take_profit_pct: 8       # GA seed42: 10→8
    timeout_days: 18         # GA seed42: 12→18
    trail_trigger_pct: 0.03  # GA seed42: 0.05→0.03
    trail_atr_mult: 1.2      # Tighter trail
    risk_per_trade_pct: 2.5  # More risk per trade
    max_portfolio_risk_pct: 0.08  # GA seed42: 0.06→0.08
