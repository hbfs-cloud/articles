portfolios:
- id: forex
  name: Forex G7+
  currency: EUR
  initial_capital: 100000
  allocations:
  - name: forex-majors
    region: FOREX
    currency: EUR
    percent: 100
    max_open_positions: 8
    forex: true
    forex_universe:
      - EURUSD
      - EURGBP
      - EURJPY
      - GBPUSD
      - USDJPY
      - USDCAD
      - GBPJPY
      - AUDUSD
    forex_leverage: 1        # 1=no leverage, 50=50:1 margin
    target_currency: EUR
    broker: simulated
    strategy: forex-momentum
    timeframe: 1d
    position_size_pct: 35.0
    max_loss_pct: 0.012
    take_profit_pct: 0.08
    timeout_days: 5
    base_stop_atr: 1.5
    dynamic_max_positions:
      risk_on: 3
      recovery: 1
      neutral: 4
      early_risk_off: 2
      risk_off: 8
    dynamic_timeout:
      risk_on: 4
      neutral: 5
      risk_off: 8
    custom_params:
      min_hold_days: 1
      trailing_stop_pct: 0.008
      dd_reduce_pct: 0.35
      sizing_cap_mult: 5.0
      toxic_combos: "EURJPY=X:RISK_ON,USDCAD=X:RISK_OFF"
      max_currency_exposure: 3
    regime_tickers:
      index: "^GSPC"
      volatility: "^VIX"
    scanner_filters:
      min_rsi: 30
      max_rsi: 75
      min_score: 8
      min_atr_pct: 0.006
