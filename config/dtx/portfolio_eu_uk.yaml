# EU deliverable — UK FTSE-250-tier mid-cap top-5 momentum rotation (long-only).
# Rotates into the 5 strongest UK mid-caps by 63-day momentum, rebalanced every 21d, abs-momentum
# filter. Mid-caps chosen over FTSE-100 large-caps for higher return dispersion.
#
# HONEST PERF (MUST run with TOTAL_RETURN=1; -end 2026-06-30 for the cache glitch),
# 2021-01-01 → 2026-06-30:
#   CAGR 20.7% / MaxDD 21.9% / Sharpe 0.91 / R2 0.87 / WR 53% / 174 trades.
#   ~2x the FTSE index B&H (~9-10% total-return). Best R2 of any EU/UK config found. Concentration
#   healthy (top-1 trade 14.9% of PnL — NOT a lottery artifact, unlike the FR mid-cap set).
#
# BAR STATUS: relaxed-bar EU deliverable. CLOSEST to the strict bar of anything EU/UK — R2 0.87 and
# CAGR<MaxDD gap only ~1.2pp — but Sharpe 0.91 (just under 1) and CAGR<DD. lb63 is the peak (lb50/55
# collapse to ~10-12%), so it is somewhat lookback-sensitive. Accepted as EU exposure by user.
#
# CAVEATS: 2026 mid-cap membership = mild look-ahead (worse for mid than mega-cap; mitigated by a
# pre-2020-06-history + $2M liquidity floor at universe build). Total-return only with TOTAL_RETURN=1.
