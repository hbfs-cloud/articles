portfolios:
- id: metals
  name: Precious Metals Trend
  currency: USD
  initial_capital: 100000
  allocations:
  - name: metals-trend
    region: US
    currency: USD
    percent: 100
    max_open_positions: 2
    stocks: true
    etfs: true
    whitelist: "GLD,SLV"
    broker: alpaca
    strategy: metals-trend
    timeframe: 1d
    position_size_pct: 50.0
    max_loss_pct: 0.35
    timeout_days: 9999
    base_stop_atr: 2.0
    custom_params:
      trailing_stop_pct: 0.99
      stop_loss_pct: 0.35
      trend_sma_period: 50
      trend_break_days: 999
    scanner_filters:
      min_score: 10
      min_rsi: 20
      max_rsi: 85
      weight_14d: 0.70
      weight_30d: 0.10
      weight_7d: 0.10
      weight_vol: 0.05
      weight_ma50: 0.05
    dynamic_max_positions:
      risk_on: 2
      recovery: 2
      neutral: 2
      early_risk_off: 2
      risk_off: 1
    regime_tickers:
      index: "^GSPC"
      volatility: "^VIX"
