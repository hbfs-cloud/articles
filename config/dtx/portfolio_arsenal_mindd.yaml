# Arsenal MIN-DD book — the conservative endpoint (criterion #1 min MaxDD, #2 max CAGR).
# 5 long-only-unlevered sleeves, EQUAL-WEIGHT 20% each: us_highvol, stockbox, etf_us, eu_dax, ep.
#
# GA/anneal weight campaign on ser (config/optimizer/book_mindd.yaml, seed42, 226 real backtests,
# walk-forward + stability audit, cost-honest COST_SPREAD_BPS=10 COST_STAMP_BPS=50 TOTAL_RETURN=1
# FROZEN_BARS_DATE=2026-07-08 -max-participation 0.1). VERDICT: the equal-weight baseline is the
# ROBUST optimum — a whole cluster of near-center genomes lands on the same ~60/DD19/S2.07 plateau.
# The higher-fitness variants squeeze +4pp CAGR only by DROPPING etf_us = knife-edge SHARP-PEAK
# (rec_score -1.9, neighbors collapse) → rejected. Equal-weight chosen for OOS stability.
#   FULL 2021-01-01..2026-06-30: CAGR 60.3% / MaxDD 19.3% / Sharpe 2.07 / R2 0.91 / 4817 trades.
#   Walk-forward: W1 2021-22 9.7%/DD17.7 (choppy, R2 0.06) · W2 22-24 64.9%/DD15.1/S2.75 ·
#                 W3 24-26 89.0%/DD14.7/S2.67. No losing window.
# Bar: R2 0.91>=0.80 · CAGR 60.3>DD 19.3 · Sharpe 2.07>=1. VIABLE.
#
# HONEST CAVEATS:
#  - DD FLOOR ~18-19% for this cost-honest long-only-unlevered US-centric pool. Lower-DD sleeves
#    that could push toward DD~9 (uk, eu_uk) are cost-traps (UK stamp × turnover) or weak → excluded.
#  - W1 (2021-22) is flat/choppy (R2 0.06-0.23): this book doesn't shine in a sideways year, it
#    protects DD. The return engine is W2/W3.
#  - eu_dax (20%) is a DIVERSIFIER here, NOT standalone-viable cost-honest (23%/DD28/S0.82). It
#    earns its slot by decorrelation, not standalone edge. (Its own config header stats are being
#    corrected separately — they were measured without costs.)
#  - Multi-broker/currency footprint (Alpaca US + Saxo EUR for eu_dax); FX treated as constant
#    scalar in the combined backtest (mild optimism, effectively FX-hedged).
#  - Universe = frozen top-2026-capi survivorship/look-ahead (common to whole book): ranking +
#    viability reliable, absolute magnitudes optimistic.
# Sleeves are faithful copies of their standalone config/dtx files — re-sync if those change.
# Prefetch first (stockbox NDX-100 + regional universes): ./prefetch -config <this file>.
portfolios:
- id: arsenal_mindd
  name: Arsenal MIN-DD (5-sleeve equal-weight)
  currency: USD
  initial_capital: 100000
  allocations:
  - name: us_highvol
    region: US
    currency: USD
    blacklist: SKYT,ALAB,RERE,QBTS,ATAI,DQ,NTLA,LCID,TE,IBRX,KOD,AUR,RXRX,TERN,NVAX,ASTS,DAWN,GLDD
    percent: 20
    broker: alpaca
    strategy: highvol-breakout-corr
    smooth_start_days: 20
    smooth_start_initial_pct: 0.5
    stocks: true
    etfs: false
    pure: true
    min_market_cap: 1000000000
    min_volume: 10000000
    max_open_positions: 15
    pending_buy_cancel_days: 1
    min_cash_reserve: 10
    max_position_value: 500000
    max_correlation: 0.8
    base_stop_atr: 2.5
    take_profit_pct: 30
    dynamic_max_loss:
      risk_on: 0.35
      recovery: 0.25
      neutral: 0.3
      early_risk_off: 0.2
      risk_off: 0.15
    trail_trigger_pct: 0.12
    trail_atr_mult: 1.5
    timeout_days: 14
    limit_price_markup: 1.025
    entry_stop_atr_mult: 6.0
    max_portfolio_risk_pct: 0.05
    dynamic_max_positions:
      risk_on: 15
      recovery: 8
      neutral: 3
      early_risk_off: 3
      risk_off: 0
    scanner_filters:
      params:
        entry_gap_down_pct: 0.13
        entry_candidate_buffer: 8
      min_p80_dollar_volume: 5000000
      min_established_dollar_volume: 3000000
      established_lookback_days: 60
      min_atr_pct: 0.07
      max_atr_ratio: 0.1
      min_dist_ma20: 0.05
      min_vol_ratio: 1.5
      max_volatility_index: 28
      max_rsi: 85
      min_score: 50
      excluded_sectors:
      - Real Estate
      - Utilities
      - Materials
