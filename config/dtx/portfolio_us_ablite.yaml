# Tuned 2026-07-03 (rg gating 12/12/8/4/0): CAGR 19.1% / DD 28.3% / Sharpe 0.90 / R2 0.86 / +17% stress-2022(v1)
# Tier-2 experimental large-cap sleeve. DD driver = single 2025-04-08 episode (structural, all variants).
# US AB-Lite — validated, liquidity-confirmed AmericanBulls subset.
# From decomposing 2.78M AB signals, ONLY these slices carry a stable net-positive edge,
# and ONLY in liquid names with volume confirmation:
#   - BULLISH_DOJI_STAR       + VolRatio>=1.5 (edge grows with liquidity: +0.65%@$3M -> +1.09%@$50M, 56.6% hit)
#   - COUNTERATTACK_BULLISH   (all liquidity tiers)
#   - BULLISH_STRONG_REVERSAL + VolRatio>=1.5 (only $50M+)
# The classic AB stop min(c0.Low,c1.Low) is hit 68-92% of the time and destroys the edge,
# so the scanner uses an ATR-based stop (price - 2.5*ATR(14)) instead.
portfolios:
- id: us_ablite
  name: US AB-Lite
  currency: USD
  initial_capital: 100000

  allocations:
  - name: us_ablite
    region: US
    currency: USD
    percent: 100
    broker: alpaca
    strategy: ab-lite  # ab-lite scanner + highvol-corr PM

    # Universe filters
    stocks: true
    etfs: false
    pure: true
    min_market_cap: 2_000_000_000
    min_volume: 5_000_000

    # Position Manager parameters
    max_open_positions: 12
    pending_buy_cancel_days: 1
    min_cash_reserve: 10
    max_position_value: 500_000

    # CORRELATION FILTER: reject candidates highly correlated with existing positions
    max_correlation: 0.80

    # Exit parameters
    base_stop_atr: 2.5
    take_profit_pct: 15
    timeout_days: 20
    trail_trigger_pct: 0.08
    trail_atr_mult: 2.0

    # Entry parameters
    limit_price_markup: 1.025
    entry_stop_atr_mult: 6.0
    max_portfolio_risk_pct: 0.05

    # Dynamic parameters by regime
    dynamic_max_positions:
      risk_on: 12
      recovery: 12
      neutral: 8
      early_risk_off: 4
      risk_off: 0

    # Scanner filters — ab-lite ignores the highvol-specific filters (min_atr_pct,
    # max_atr_ratio, min_dist_ma20, min_vol_ratio, max_volatility_index, max_rsi,
    # min_score, excluded_sectors). Only the central liquidity gate + params apply.
    scanner_filters:
      # Point-in-time survivorship / look-ahead guard (median $vol over 60 bars),
      # applied centrally in TrendStrategy.Apply() for every scanner.
      min_established_dollar_volume: 10_000_000
      established_lookback_days: 60
      params:
        min_vol_ratio_ab: 1.5
