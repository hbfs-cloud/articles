# EU UCITS ETF Strategy
#
# Euro-denominated UCITS ETFs on European exchanges
# Uses etf-momentum scanner adapted for EU regime data
# Includes leveraged ETPs for higher alpha
#
# OPTIMIZED: CAGR 70.74%, R² 0.95, MaxDD 24.56%, Sharpe 2.08 (3 positions, 2964 EU ETFs)
# Improvements: early_exit + circuit_breaker + toxic blacklist (BTC.PA, 3OIL.MI, NUKL.DE)

portfolios:
  - id: etf_eu
    name: EU ETF / T212
    currency: EUR
    initial_capital: 100000

    allocations:
      - name: etf_eu
        region: FR,DE,NL,IT,ES
        currency: EUR
        percent: 100
        max_open_positions: 3           # Optimal (tested 2-12)
        stocks: false
        etfs: true
        pure: false  # Include leveraged ETPs for higher alpha
        broker: t212-manual
        strategy: etf-momentum
        regime_tickers:
          index: "^STOXX50E"
          volatility: "^V2TX"
        # PM parameters
        risk_per_trade_pct: 2.5
        base_stop_atr: 1.5              # Optimal (tested 1.0-2.5)
        min_cash_reserve: 10
        pending_buy_cancel_days: 1
        # Early exit: cut fast losers (>5% loss in first 5 days)
        early_exit:
          enabled: true
          min_days: 2
          max_days: 5
          max_loss_pct: 0.05
        # Circuit breaker: pause after 4 stops in 5 days
        circuit_breaker:
          stop_period_days: 5
          max_stops_before_pause: 4
          base_pause_days: 3
          max_pause_multiplier: 2
        # Dynamic max loss by regime
        dynamic_max_loss:
          risk_on: 0.17
          recovery: 0.17
          neutral: 0.17
          early_risk_off: 0.17
          risk_off: 0.17
        # Scanner filters (OPTIMIZED)
        scanner_filters:
          min_price: 5
          max_atr_ratio: 0.06
          min_score: 80                  # Optimal (tested 50-100, 80 best)
          volatility_ticker: "^V2TX"
          params:
            blacklist:
              - ZETH.DE    # Ethereum ETP: -22K PnL
              - GDXJ.PA   # Junior Gold Miners: -30K PnL
              - BRE.PA     # Brewin: -8K PnL
              - IQQH.DE   # Clean Energy: -4K PnL
              - EXV7.DE   # Industrial Goods: -2.8K PnL
              - EXH2.DE   # Chemicals: -2.7K PnL
              - EXV2.DE   # Industrials: -2K PnL
              - ZPRR.DE   # Physical Platinum: -1.8K PnL
              - EXV4.DE   # Healthcare: -1.3K PnL
              - EXV5.DE   # Banks: -1.1K PnL
              - EXV6.DE   # Insurance: -0.3K PnL
              - CC1.PA    # Crypto Alt basket
              - BTC.PA    # Crypto: -105K, PF 0.12, 8 trades
              - 3OIL.MI   # Leveraged oil: -48K, PF 0.31, 13 trades
              - NUKL.DE   # Nuclear theme: -44K, PF 0.28, 5 trades
              # Deep analysis repeat losers:
              - BNXG.DE   # -38K, 12 trades, catastrophic tail
              - SLVR.DE   # -35K, 7 trades, silver
              - NGAS.MI   # -32K, 19 trades, natural gas
              - VVMX.DE   # -30K, 9 trades, 22% WR
              - DAXLEV.MI # -25K, 8 trades, leveraged DAX
              - M9SD.DE   # -21K, 3 trades, 0% WR
              - GDXJ.MI   # -21K, 4 trades, gold miners tail
              - PHAU.AS   # -21K, 3 trades, physical gold
              - WDNA.MI   # -17K, 5 trades, 20% WR
              - 3USS.MI   # -16K, 15 trades, 27% WR
              - XCNA.MI   # -15K, 7 trades, 29% WR
              - CURE.MI   # -13K, 4 trades, 0% WR
              - REMX.MI   # -12K, 8 trades, 13% WR
            # MA200 regime filters (strongest signal: +750K above vs +100K below)
            # RISK_ON params
            riskon_max_atr: 0.045
            riskon_min_mom: 0.06
            riskon_rsi_boost_thresh: 70
            riskon_rsi_boost_factor: 3.0     # Lower = less RSI bias (tested 3-10, 3 best)
            # RECOVERY params
            recovery_max_rsi: 45             # Tighter (tested 40-55, 45 best)
            recovery_max_atr: 0.04
            recovery_min_mom: 0.03
            # RISK_OFF params
            riskoff_deep_dip_dist: -0.05
            riskoff_oversold_rsi: 40
            riskoff_meanrev_rsi: 50
            # NEUTRAL params
            neutral_meanrev_rsi: 40
            neutral_meanrev_dist: -0.03
            neutral_lowvol_atr: 0.035        # Optimal (tested 0.02-0.04, 0.035 best)
            neutral_lowvol_mom: 0.08         # Optimal (tested 0.03-0.08, 0.08 best)
            # EARLY_RISK_OFF params
            early_riskoff_max_rsi: 18       # Optimal (tested 10-20, 18 best in combo)
            early_riskoff_min_dist: -0.10
            # EXTREME fallback
            extreme_mom_thresh: 0.15
            extreme_oversold_rsi: 30
            extreme_oversold_dist: -0.05
            extreme_min_dist_ma20: 0.0
            extreme_skip_early_riskoff: 1.0
            extreme_skip_neutral: 1.0
