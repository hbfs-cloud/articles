<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyTickers — A+ Picks Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:transparent}

/* ══════ TICKER TAPE MODE — DARK (default) ══════ */
.tape{display:flex;align-items:center;height:38px;overflow:hidden;position:relative}
body:has(.tape){overflow:hidden}
.tape--dark{background:linear-gradient(135deg,#0f172a,#1e293b)}
.tape--light{background:#f1f5f9}
.tape-brand{display:flex;align-items:center;gap:5px;padding:0 12px;flex-shrink:0;height:100%;cursor:pointer;text-decoration:none}
.tape--dark .tape-brand{border-right:1px solid #334155}
.tape--light .tape-brand{border-right:1px solid #cbd5e1}
.tape-brand img{height:18px}
.tape--dark .tape-brand span{font-size:.6rem;font-weight:800;color:#e2e8f0;letter-spacing:.04em}
.tape--light .tape-brand span{font-size:.6rem;font-weight:800;color:#334155;letter-spacing:.04em}
.tape-regime{display:flex;align-items:center;gap:5px;padding:0 12px;flex-shrink:0;height:100%}
.tape--dark .tape-regime{border-right:1px solid #334155}
.tape--light .tape-regime{border-right:1px solid #cbd5e1}
.tape-regime-dot{width:6px;height:6px;border-radius:50%;animation:pulse-dot 2s infinite}
.tape-regime-label{font-size:.58rem;font-weight:700;color:#94a3b8;text-transform:uppercase}
.tape-regime-value{font-size:.62rem;font-weight:800}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
.tape-track{display:flex;overflow:hidden;flex:1;height:100%;position:relative}
.tape-scroll{display:flex;animation:tape-scroll var(--duration,60s) linear infinite;height:100%}
.tape-scroll:hover{animation-play-state:paused}
.tape-item{display:flex;align-items:center;gap:8px;padding:0 16px;height:100%;flex-shrink:0;cursor:pointer;transition:background .2s;text-decoration:none}
.tape--dark .tape-item{border-right:1px solid #1e293b}
.tape--dark .tape-item:hover{background:rgba(99,102,241,.12)}
.tape--light .tape-item{border-right:1px solid #e2e8f0}
.tape--light .tape-item:hover{background:rgba(99,102,241,.08)}
.tape-logo{width:18px;height:18px;border-radius:4px;object-fit:cover}
.tape--dark .tape-ticker{font-size:.72rem;font-weight:800;color:#f1f5f9}
.tape--light .tape-ticker{font-size:.72rem;font-weight:800;color:#0f172a}
.tape-flag{font-size:.6rem}
.tape--dark .tape-strat{font-size:.52rem;font-weight:700;color:#a78bfa;background:rgba(167,139,250,.15);padding:1px 5px;border-radius:3px}
.tape--light .tape-strat{font-size:.52rem;font-weight:700;color:#7c3aed;background:rgba(124,58,237,.1);padding:1px 5px;border-radius:3px}
.tape--dark .tape-entry{font-size:.62rem;color:#94a3b8}
.tape--dark .tape-entry strong{color:#e2e8f0}
.tape--light .tape-entry{font-size:.62rem;color:#64748b}
.tape--light .tape-entry strong{color:#0f172a}
.tape--dark .tape-rr{font-size:.58rem;font-weight:800;color:#34d399}
.tape--light .tape-rr{font-size:.58rem;font-weight:800;color:#059669}
.tape--dark .tape-score{font-size:.58rem;font-weight:800;color:#818cf8;background:rgba(129,140,248,.12);padding:1px 5px;border-radius:3px}
.tape--light .tape-score{font-size:.58rem;font-weight:800;color:#6366f1;background:rgba(99,102,241,.08);padding:1px 5px;border-radius:3px}
.tape-actions{display:flex;align-items:center;gap:2px;padding:0 8px;flex-shrink:0;height:100%}
.tape--dark .tape-actions{border-left:1px solid #334155}
.tape--light .tape-actions{border-left:1px solid #cbd5e1}
.tape--dark .tape-btn{background:none;border:none;color:#64748b;cursor:pointer;padding:4px 6px;font-size:.68rem;transition:color .2s;border-radius:4px}
.tape--dark .tape-btn:hover{color:#e2e8f0;background:rgba(255,255,255,.06)}
.tape--light .tape-btn{background:none;border:none;color:#94a3b8;cursor:pointer;padding:4px 6px;font-size:.68rem;transition:color .2s;border-radius:4px}
.tape--light .tape-btn:hover{color:#6366f1;background:rgba(99,102,241,.08)}
@keyframes tape-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ══════ LIVE PRICE STATES ══════ */
.pw-price{font-family:'Inter',monospace;font-weight:700;font-size:.62rem}
.pw-chg{font-size:.52rem;font-weight:700}
.pw-chg.up{color:#10b981}
.pw-chg.down{color:#ef4444}
.pw-chg.flat{color:#64748b}
.pw-badge{font-size:.42rem;font-weight:800;padding:1px 4px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.pw-badge.trending{background:#ecfdf5;color:#059669}
.pw-badge.entry-zone{background:#fffbeb;color:#d97706;animation:pw-pulse 1.5s infinite}
.pw-badge.near-stop{background:#fef2f2;color:#dc2626;animation:pw-pulse 1s infinite}
.pw-badge.stopped{background:#f1f5f9;color:#94a3b8}
.pw-badge.tp1-hit{background:#ecfdf5;color:#059669}
.pw-badge.tp2-hit{background:#fefce8;color:#a16207}
.pw-badge.underwater{background:#fef2f2;color:#ef4444}
@keyframes pw-pulse{0%,100%{opacity:1}50%{opacity:.5}}
/* Tape status dot */
.tape-status{width:5px;height:5px;border-radius:50%;flex-shrink:0}
/* Stopped item */
.tape-item.pw-stopped-item{opacity:.35;filter:grayscale(.8)}
.vp.pw-stopped-card{opacity:.35;filter:grayscale(.8);pointer-events:none}
.vp.pw-trending-card{border-color:#86efac}
.vp.pw-entry-zone-card{border-color:#fbbf24}
.vp.pw-near-stop-card{border-color:#fca5a5}
.vp.pw-tp1-card{border-color:#34d399;background:#f0fdf4}
.vp.pw-tp2-card{border-color:#fbbf24;background:#fefce8}

/* ══════ VERTICAL LIST MODE ══════ */
.vlist{background:#f8fafc;min-height:100vh;padding:8px}
.vlist-header{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.vlist-brand{display:flex;align-items:center;gap:5px;text-decoration:none}
.vlist-brand img{height:16px}
.vlist-brand span{font-size:.6rem;font-weight:800;color:#0f172a;letter-spacing:.04em}
.vlist-meta{display:flex;align-items:center;gap:8px}
.vlist-regime{font-size:.58rem;font-weight:700;padding:2px 7px;border-radius:4px}
.vlist-actions{display:flex;gap:2px}
.vlist-btn{background:none;border:1px solid #e2e8f0;color:#64748b;cursor:pointer;padding:3px 7px;font-size:.6rem;border-radius:5px;transition:all .15s}
.vlist-btn:hover{color:#6366f1;border-color:#a5b4fc;background:#eef2ff}
.vlist-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.vp{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;transition:all .2s;cursor:pointer;text-decoration:none;display:block;color:inherit}
.vp:hover{border-color:#a5b4fc}
.vp-top{display:flex;align-items:center;gap:6px}
.vp-logo{width:24px;height:24px;border-radius:6px;object-fit:cover;border:1px solid #f1f5f9;flex-shrink:0}
.vp-info{flex:1;min-width:0}
.vp-row1{display:flex;align-items:center;gap:4px}
.vp-ticker{font-size:.76rem;font-weight:800;color:#0f172a}
.vp-flag{font-size:.58rem}
.vp-type{font-size:.45rem;font-weight:700;padding:1px 4px;border-radius:3px;text-transform:uppercase}
.vp-type--stock{background:#dbeafe;color:#1d4ed8}
.vp-type--etf{background:#fef3c7;color:#92400e}
.vp-name{font-size:.5rem;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp-score{font-size:.82rem;font-weight:900;color:#6366f1;text-align:right;line-height:1}
.vp-score small{display:block;font-size:.42rem;color:#a5b4fc;font-weight:600}
.vp-mid{display:flex;align-items:center;gap:4px;margin-top:4px}
.vp-strat{font-size:.52rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:1px 6px;border-radius:4px}
.vp-rr{font-size:.56rem;font-weight:800;color:#059669;background:#ecfdf5;padding:1px 6px;border-radius:4px}
/* Live price row in vertical mode */
.vp-live{display:flex;align-items:center;gap:6px;margin-top:4px;padding:3px 0;min-height:18px}
.vp-live-price{font-size:.72rem;font-weight:800;color:#0f172a;font-family:'Inter',monospace}
.vp-live-chg{font-size:.56rem;font-weight:700}
.vp-live-chg.up{color:#10b981}
.vp-live-chg.down{color:#ef4444}
.vp-live-chg.flat{color:#94a3b8}
.vp-levels{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:4px}
.vp-lv{text-align:center}
.vp-lv-label{display:block;font-size:.4rem;font-weight:600;color:#94a3b8;text-transform:uppercase}
.vp-lv-val{display:block;font-size:.56rem;font-weight:700;color:#475569}
.vp-lv-val.entry{color:#0f172a;font-weight:800}
.vp-lv-val.stop{color:#dc2626}
.vp-lv-val.tp{color:#059669}
.vp-cat{font-size:.48rem;color:#6366f1;margin-top:3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vlist-footer{text-align:center;padding:6px 0 2px}
.vlist-footer a{font-size:.58rem;color:#6366f1;text-decoration:none;font-weight:700}
.vlist-footer a:hover{text-decoration:underline}

/* ══════ TOAST ══════ */
.toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#0f172a;color:#e2e8f0;font-size:.7rem;font-weight:600;padding:8px 18px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

/* ══════ EMBED PAGE MODE ══════ */
.embed-page{background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.embed-box{background:#fff;border-radius:16px;padding:28px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.embed-box h2{font-size:1.1rem;font-weight:800;color:#0f172a;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.embed-box .embed-sub{font-size:.72rem;color:#64748b;margin-bottom:20px}
.embed-section{margin-bottom:18px}
.embed-section h3{font-size:.78rem;font-weight:700;color:#334155;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.embed-section h3 i{color:#6366f1}
.embed-preview{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:8px;overflow:hidden}
.embed-code{width:100%;font-family:'Inter',monospace;font-size:.62rem;background:#0f172a;color:#a5b4fc;border:none;border-radius:8px;padding:12px;resize:none;line-height:1.5}
.embed-copy-btn{display:inline-flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;font-size:.68rem;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;border:none;background:#6366f1;color:#fff;transition:background .2s}
.embed-copy-btn:hover{background:#4f46e5}
.embed-options{display:flex;gap:8px;margin-bottom:14px}
.embed-opt{flex:1;padding:10px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;text-align:center;transition:all .2s;background:#fff}
.embed-opt:hover{border-color:#a5b4fc}
.embed-opt.active{border-color:#6366f1;background:#eef2ff}
.embed-opt i{font-size:1.2rem;color:#6366f1;display:block;margin-bottom:4px}
.embed-opt span{font-size:.65rem;font-weight:700;color:#334155}
.embed-opt small{display:block;font-size:.5rem;color:#94a3b8;margin-top:2px}
.embed-theme-row{display:flex;gap:8px;margin-bottom:14px}
.embed-theme{flex:1;padding:8px;border:2px solid #e2e8f0;border-radius:8px;cursor:pointer;text-align:center;transition:all .2s}
.embed-theme:hover{border-color:#a5b4fc}
.embed-theme.active{border-color:#6366f1}
.embed-theme-swatch{height:20px;border-radius:4px;margin-bottom:4px}
.embed-theme span{font-size:.58rem;font-weight:700;color:#334155}
.embed-brand{text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid #e2e8f0}
.embed-brand a{display:inline-flex;align-items:center;gap:5px;font-size:.6rem;font-weight:700;color:#94a3b8;text-decoration:none}
.embed-brand a:hover{color:#6366f1}
.embed-brand img{height:14px;opacity:.5}

@media(max-width:600px){
  .vlist-grid{grid-template-columns:1fr}
  .tape{height:34px}
  .tape-brand span{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var WATCHLIST_URL = 'https://articles.dailytickers.com/mcp/watchlist.json';
  var YAHOO_PROXY = 'https://api.allorigins.win/get?url=';
  var YAHOO_PROXY_FALLBACK = 'https://corsproxy.io/?url=';
  var BINANCE_API = 'https://api.binance.com/api/v3/ticker/price';
  var FLAGS = { US: '\ud83c\uddfa\ud83c\uddf8', EU: '\ud83c\uddea\ud83c\uddfa', APAC: '\ud83c\udf0f', ETF: '\ud83d\udcca' };

  var params = new URLSearchParams(location.search);
  var mode = params.get('mode') || 'tape';
  var theme = params.get('theme') || 'dark';
  var bg = params.get('bg') || '';
  var showPrice = params.get('price') !== 'false';   // default: true
  var showAlert = params.get('alert') === 'true';     // default: false

  var livePrices = {};     // { TICKER: { price, chg, chgPct, time } }
  var prevStatuses = {};   // for alert dedup
  var alertCooldowns = {}; // { TICKER: timestamp }
  var pollTimer = null;
  var watchlistData = null;

  // ══════ Helpers ══════
  function yahooUrl(t) { return 'https://finance.yahoo.com/quote/' + encodeURIComponent(t) + '/'; }
  function regimeColor(r) { if(!r) return '#64748b'; r=r.toUpperCase(); return r.indexOf('RISK-OFF')>=0?'#ef4444':r.indexOf('RISK-ON')>=0?'#10b981':'#f59e0b'; }
  function isETF(p) { return p.region==='ETF'||(p.tags&&p.tags.indexOf('etf')>=0); }
  function typeLabel(p) { return isETF(p)?'ETF':'Stock'; }
  function isCrypto(p) { return (p.tags&&p.tags.indexOf('crypto')>=0)||/\-USD$/i.test(p.ticker); }
  function fmt(n) { return n>=1000?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):n.toFixed(2); }

  function toast(msg) {
    var el=document.getElementById('toast');
    el.textContent=msg;el.classList.add('show');
    setTimeout(function(){el.classList.remove('show');},2000);
  }

  // ══════ Position Classification ══════
  function classify(pick, price) {
    if (!price) return { status:'unknown', cls:'', label:'', color:'#64748b' };
    var entry=pick.entry, stop=pick.stop, tp1=pick.tp1, tp2=pick.tp2||tp1*1.1;
    var isLong = entry > stop;

    // TP2 hit
    if (tp2 && (isLong ? price>=tp2 : price<=tp2)) return { status:'tp2-hit', cls:'tp2-hit', label:'TP2 \u2713', color:'#a16207' };
    // TP1 hit
    if (isLong ? price>=tp1 : price<=tp1) return { status:'tp1-hit', cls:'tp1-hit', label:'TP1 \u2713', color:'#059669' };
    // Stopped out
    if (isLong ? price<=stop : price>=stop) return { status:'stopped', cls:'stopped', label:'STOPPED', color:'#94a3b8' };
    // Near stop (within 2%)
    if (Math.abs(price-stop)/stop <= 0.02) return { status:'near-stop', cls:'near-stop', label:'Near Stop', color:'#ef4444' };
    // Near entry (within 2%)
    if (Math.abs(price-entry)/entry <= 0.02) return { status:'entry-zone', cls:'entry-zone', label:'Entry Zone', color:'#d97706' };
    // Good trend (above entry for long, below for short)
    if (isLong ? price>entry : price<entry) return { status:'trending', cls:'trending', label:'Trending', color:'#10b981' };
    // Underwater (between stop and entry, wrong side)
    return { status:'underwater', cls:'underwater', label:'Underwater', color:'#ef4444' };
  }

  // ══════ Price Fetching ══════
  function fetchBinancePrice(ticker) {
    // BTC-USD → BTCUSDT
    var sym = ticker.replace('-USD','USDT');
    return fetch(BINANCE_API+'?symbol='+sym)
      .then(function(r){return r.json();})
      .then(function(d){return { ticker:ticker, price:parseFloat(d.price) };})
      .catch(function(){return null;});
  }

  function parseYahooChart(d, sym) {
    var result = d.chart && d.chart.result && d.chart.result[0];
    if (!result) return null;
    var meta = result.meta;
    var price = meta.regularMarketPrice;
    var prevClose = meta.chartPreviousClose || meta.previousClose;
    var chg = prevClose ? price - prevClose : 0;
    var chgPct = prevClose ? (chg/prevClose)*100 : 0;
    return { ticker:sym, price:price, chg:chg, chgPct:chgPct };
  }

  function fetchYahooPrices(symbols) {
    // Batch via v8 chart — one request per symbol via allorigins proxy (fallback: corsproxy)
    var fetches = symbols.map(function(sym) {
      var yahooUrl = 'https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=1d';
      var url = YAHOO_PROXY + encodeURIComponent(yahooUrl);
      return fetch(url, { signal: AbortSignal.timeout(12000) })
        .then(function(r){return r.json();})
        .then(function(wrapper){
          var d = JSON.parse(wrapper.contents);
          return parseYahooChart(d, sym);
        })
        .catch(function(){
          // Fallback: try corsproxy.io
          var fallbackUrl = YAHOO_PROXY_FALLBACK + encodeURIComponent(yahooUrl);
          return fetch(fallbackUrl, { signal: AbortSignal.timeout(12000) })
            .then(function(r){return r.json();})
            .then(function(d){return parseYahooChart(d, sym);})
            .catch(function(){return null;});
        });
    });
    return Promise.allSettled(fetches).then(function(results){
      var out = [];
      results.forEach(function(r){if(r.status==='fulfilled'&&r.value) out.push(r.value);});
      return out;
    });
  }

  function fetchAllPrices(picks) {
    var cryptoTickers = [], stockTickers = [];
    picks.forEach(function(p) {
      if (isCrypto(p)) cryptoTickers.push(p.ticker);
      else stockTickers.push(p.ticker);
    });

    var tasks = [];
    if (stockTickers.length) tasks.push(fetchYahooPrices(stockTickers));
    cryptoTickers.forEach(function(t) { tasks.push(fetchBinancePrice(t).then(function(r){return r?[r]:[];})); });

    return Promise.allSettled(tasks).then(function(results) {
      results.forEach(function(r) {
        if (r.status !== 'fulfilled') return;
        var arr = Array.isArray(r.value) ? r.value : [r.value];
        arr.forEach(function(item) {
          if (!item) return;
          livePrices[item.ticker] = {
            price: item.price,
            chg: item.chg || 0,
            chgPct: item.chgPct || 0,
            time: Date.now()
          };
        });
      });
    });
  }

  // ══════ DOM Update (after price fetch) ══════
  function updateLivePrices(picks) {
    picks.forEach(function(p) {
      var lp = livePrices[p.ticker];
      if (!lp) return;
      var st = classify(p, lp.price);

      // Tape mode updates
      document.querySelectorAll('.tape-item[data-ticker="'+p.ticker+'"]').forEach(function(el) {
        // Status dot
        var dot = el.querySelector('.tape-status');
        if (dot) { dot.style.background = st.color; dot.title = st.label; }
        // Live price
        var prEl = el.querySelector('.tape-live');
        if (prEl) {
          prEl.textContent = '$'+fmt(lp.price);
          prEl.style.color = lp.chg >= 0 ? '#34d399' : '#f87171';
        }
        // Stopped state
        el.classList.toggle('pw-stopped-item', st.status === 'stopped');
      });

      // Vertical mode updates
      var card = document.querySelector('.vp[data-ticker="'+p.ticker+'"]');
      if (card) {
        // Live price row
        var liveRow = card.querySelector('.vp-live');
        if (liveRow) {
          var prSpan = liveRow.querySelector('.vp-live-price');
          var chgSpan = liveRow.querySelector('.vp-live-chg');
          var badge = liveRow.querySelector('.pw-badge');
          if (prSpan) prSpan.textContent = '$'+fmt(lp.price);
          if (chgSpan) {
            var sign = lp.chg >= 0 ? '+' : '';
            chgSpan.textContent = sign+lp.chgPct.toFixed(2)+'%';
            chgSpan.className = 'vp-live-chg ' + (lp.chg>0?'up':lp.chg<0?'down':'flat');
          }
          if (badge) { badge.textContent = st.label; badge.className = 'pw-badge '+st.cls; }
        }
        // Card border state
        card.className = 'vp';
        if (st.status === 'stopped') card.classList.add('pw-stopped-card');
        else if (st.status === 'trending' || st.status === 'tp1-hit') card.classList.add('pw-trending-card');
        else if (st.status === 'tp2-hit') card.classList.add('pw-tp2-card');
        else if (st.status === 'entry-zone') card.classList.add('pw-entry-zone-card');
        else if (st.status === 'near-stop') card.classList.add('pw-near-stop-card');
      }

      // Alerts
      if (showAlert && st.status !== 'unknown') checkAlertForPick(p, st, lp);
    });
  }

  // ══════ Browser Notifications ══════
  function checkAlertForPick(pick, st, lp) {
    var key = pick.ticker;
    var prev = prevStatuses[key];
    prevStatuses[key] = st.status;
    if (!prev || prev === st.status) return; // no change
    // Cooldown: 5 min per ticker
    if (alertCooldowns[key] && Date.now()-alertCooldowns[key] < 300000) return;

    var alertStatuses = ['entry-zone','near-stop','stopped','tp1-hit','tp2-hit'];
    if (alertStatuses.indexOf(st.status) === -1) return;

    alertCooldowns[key] = Date.now();
    var icons = { 'entry-zone':'\ud83d\udfe1', 'near-stop':'\ud83d\udd34', 'stopped':'\u26d4', 'tp1-hit':'\u2705', 'tp2-hit':'\ud83c\udfc6' };
    var body = icons[st.status]+' '+pick.ticker+' — '+st.label+' at $'+fmt(lp.price);
    if (Notification.permission === 'granted') {
      new Notification('DailyTickers Alert', { body: body, icon: 'https://articles.dailytickers.com/logo.svg' });
    }
  }

  function requestAlertPermission() {
    if (!showAlert) return;
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }

  // ══════ Polling ══════
  function startPolling(picks) {
    if (!showPrice) return;
    function poll() {
      fetchAllPrices(picks).then(function() { updateLivePrices(picks); });
    }
    poll(); // immediate
    var hasCrypto = picks.some(isCrypto);
    var interval = hasCrypto ? 15000 : 30000;
    pollTimer = setInterval(poll, interval);
  }

  // ══════ Copy for Chat ══════
  function copyForChat(data) {
    var sorted = data.picks.slice().sort(function(a,b){ return (b.score||0) - (a.score||0); });
    var lines = [];
    lines.push('\ud83c\udfaf *DailyTickers A+ Picks*');
    lines.push('\ud83d\udcc5 ' + new Date(data.updated).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'}));
    lines.push('');
    lines.push('\ud83c\udf21\ufe0f Regime: *' + data.regime + '* | VIX: ' + data.vix + ' | SPX: ' + (data.spx||'').toLocaleString() + ' | F&G: ' + data.fear_greed + '/100');
    lines.push('');
    sorted.forEach(function(p) {
      var flag = FLAGS[p.region] || '';
      var t = isETF(p) ? '\ud83d\udcca' : '\ud83c\udfe2';
      var lp = livePrices[p.ticker];
      var priceStr = lp ? ' | Now: $'+fmt(lp.price) : '';
      lines.push(flag + ' *' + p.ticker + '* ' + t + ' | ' + p.strategy + (p.score != null ? ' | Score: ' + p.score + '/100' : '') + priceStr);
      lines.push('   Entry: $' + p.entry + ' | Stop: $' + p.stop + ' | TP1: $' + p.tp1 + (p.tp2 ? ' | TP2: $' + p.tp2 : '') + ' | R:R ' + p.rr);
      if (p.catalyst) lines.push('   \u26a1 ' + p.catalyst);
      lines.push('');
    });
    lines.push('\ud83d\udd17 Full report: ' + (data.url || 'https://articles.dailytickers.com/scanner/'));
    lines.push('\u00a9 DailyTickers \u2014 articles.dailytickers.com');
    navigator.clipboard.writeText(lines.join('\n')).then(function(){ toast('Copied! Paste in Telegram / Discord'); });
  }

  function openEmbedModal() {
    if (window.parent !== window) window.parent.postMessage({ type: 'mw-embed-modal' }, '*');
    else window.location.href = '/widget/?mode=embed';
  }
  window._openEmbed = openEmbedModal;

  // ══════ RENDER: Tape ══════
  function renderTape(data) {
    var root = document.getElementById('root');
    var sorted = data.picks.slice().sort(function(a,b){ return (b.score||0) - (a.score||0); });
    var themeClass = theme === 'light' ? 'tape--light' : 'tape--dark';
    var isDark = theme !== 'light';
    var h = '<div class="tape ' + themeClass + '"';
    if (bg) h += ' style="background:#' + bg + '"';
    h += '>';
    h += '<a href="https://articles.dailytickers.com/" target="_blank" class="tape-brand">';
    h += '<img src="https://articles.dailytickers.com/logo.svg" alt="MW">';
    h += '<span>MARKET WATCH</span></a>';
    if (data.regime) {
      h += '<div class="tape-regime">';
      h += '<div class="tape-regime-dot" style="background:' + regimeColor(data.regime) + '"></div>';
      h += '<span class="tape-regime-value" style="color:' + regimeColor(data.regime) + '">' + data.regime + '</span></div>';
    }
    h += '<div class="tape-track"><div class="tape-scroll">';
    for (var dup = 0; dup < 2; dup++) {
      sorted.forEach(function(p) {
        var flag = FLAGS[p.region] || '';
        h += '<a href="' + yahooUrl(p.ticker) + '" target="_blank" class="tape-item" data-ticker="'+p.ticker+'">';
        if (showPrice) h += '<div class="tape-status" style="background:#64748b;" title="Loading..."></div>';
        h += '<img src="https://assets.parqet.com/logos/symbol/' + p.ticker + '?format=jpg" alt="" class="tape-logo" onerror="this.style.display=\'none\'">';
        h += '<span class="tape-ticker">' + p.ticker + '</span>';
        h += '<span class="tape-flag">' + flag + '</span>';
        if (showPrice) h += '<span class="tape-live pw-price" style="color:'+(isDark?'#94a3b8':'#64748b')+'">—</span>';
        h += '<span class="tape-strat">' + p.strategy + '</span>';
        h += '<span class="tape-entry">$<strong>' + p.entry + '</strong></span>';
        h += '<span class="tape-rr">R:R ' + p.rr + '</span>';
        if (p.score != null) h += '<span class="tape-score">' + p.score + '</span>';
        h += '</a>';
      });
    }
    h += '</div></div>';
    h += '<div class="tape-actions">';
    h += '<button class="tape-btn" title="Copy for Telegram/Discord" onclick="window._copyChat()"><i class="fa-solid fa-copy"></i></button>';
    h += '<button class="tape-btn" title="Embed" onclick="window._openEmbed()"><i class="fa-solid fa-code"></i></button>';
    h += '<a href="' + (data.url || 'https://articles.dailytickers.com/scanner/') + '" target="_blank" class="tape-btn" title="Full Report"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>';
    h += '</div></div>';
    root.innerHTML = h;
    var scrollEl = root.querySelector('.tape-scroll');
    if (scrollEl) { scrollEl.style.setProperty('--duration', Math.max(30, sorted.length * 5) + 's'); }
  }

  // ══════ RENDER: Vertical ══════
  function renderVertical(data) {
    var root = document.getElementById('root');
    var sorted = data.picks.slice().sort(function(a,b){ return (b.score||0) - (a.score||0); });
    var h = '<div class="vlist">';
    h += '<div class="vlist-header">';
    h += '<a href="https://articles.dailytickers.com/" target="_blank" class="vlist-brand">';
    h += '<img src="https://articles.dailytickers.com/logo.svg" alt="MW"><span>A+ PICKS</span></a>';
    h += '<div class="vlist-meta">';
    h += '<span class="vlist-regime" style="background:' + regimeColor(data.regime) + '22;color:' + regimeColor(data.regime) + '">' + (data.regime || '?') + '</span>';
    h += '<div class="vlist-actions">';
    h += '<button class="vlist-btn" title="Copy" onclick="window._copyChat()"><i class="fa-solid fa-copy"></i></button>';
    h += '<button class="vlist-btn" title="Embed" onclick="window._openEmbed()"><i class="fa-solid fa-code"></i></button>';
    h += '</div></div></div>';
    h += '<div class="vlist-grid">';
    sorted.forEach(function(p) {
      var flag = FLAGS[p.region] || '';
      var tp = typeLabel(p).toLowerCase();
      h += '<a href="' + yahooUrl(p.ticker) + '" target="_blank" class="vp" data-ticker="'+p.ticker+'">';
      h += '<div class="vp-top">';
      h += '<img src="https://assets.parqet.com/logos/symbol/' + p.ticker + '?format=jpg" alt="" class="vp-logo" onerror="this.style.display=\'none\'">';
      h += '<div class="vp-info"><div class="vp-row1">';
      h += '<span class="vp-ticker">' + p.ticker + '</span>';
      h += '<span class="vp-flag">' + flag + '</span>';
      h += '<span class="vp-type vp-type--' + tp + '">' + typeLabel(p) + '</span>';
      h += '</div><div class="vp-name">' + (p.name || '') + '</div></div>';
      if (p.score != null) h += '<div class="vp-score">' + p.score + '<small>/100</small></div>';
      h += '</div>';
      h += '<div class="vp-mid"><span class="vp-strat">' + p.strategy + '</span><span class="vp-rr">R:R ' + p.rr + '</span></div>';
      // Live price row
      if (showPrice) {
        h += '<div class="vp-live">';
        h += '<span class="vp-live-price" style="color:#94a3b8;">—</span>';
        h += '<span class="vp-live-chg flat">—</span>';
        h += '<span class="pw-badge" style="visibility:hidden;">—</span>';
        h += '</div>';
      }
      h += '<div class="vp-levels">';
      h += '<div class="vp-lv"><span class="vp-lv-label">Entry</span><span class="vp-lv-val entry">$' + p.entry + '</span></div>';
      h += '<div class="vp-lv"><span class="vp-lv-label">Stop</span><span class="vp-lv-val stop">$' + p.stop + '</span></div>';
      h += '<div class="vp-lv"><span class="vp-lv-label">TP1</span><span class="vp-lv-val tp">$' + p.tp1 + '</span></div>';
      h += '<div class="vp-lv"><span class="vp-lv-label">TP2</span><span class="vp-lv-val tp">$' + (p.tp2 || '-') + '</span></div>';
      h += '</div>';
      if (p.catalyst) h += '<div class="vp-cat"><i class="fa-solid fa-bolt" style="color:#6366f1;font-size:.42rem"></i> ' + p.catalyst + '</div>';
      h += '</a>';
    });
    h += '</div>';
    h += '<div class="vlist-footer"><a href="' + (data.url || 'https://articles.dailytickers.com/scanner/') + '" target="_blank"><i class="fa-solid fa-chart-line"></i> Full Scanner Report</a>';
    if (showPrice) h += ' &nbsp;\u00b7&nbsp; <span style="font-size:.42rem;color:#94a3b8"><i class="fa-solid fa-bolt"></i> Live prices</span>';
    h += ' &nbsp;\u00b7&nbsp; <span style="font-size:.48rem;color:#94a3b8">\u00a9 DailyTickers</span></div>';
    h += '</div>';
    root.innerHTML = h;
  }

  // ══════ RENDER: Embed Page ══════
  function renderEmbedPage(data) {
    document.body.style.overflow = 'auto';
    var root = document.getElementById('root');
    var base = 'https://articles.dailytickers.com/widget/';
    var tapeCodeDark  = '<iframe src="'+base+'?mode=tape&theme=dark" style="width:100%;height:38px;border:none;" title="DailyTickers A+ Picks"></iframe>';
    var tapeCodeLight = '<iframe src="'+base+'?mode=tape&theme=light" style="width:100%;height:38px;border:none;" title="DailyTickers A+ Picks"></iframe>';
    var verticalCode  = '<iframe src="'+base+'?mode=vertical" style="width:380px;height:600px;border:none;border-radius:12px;" title="DailyTickers A+ Picks"></iframe>';

    var h = '<div class="embed-page">';
    h += '<div class="embed-box">';
    h += '<h2><i class="fa-solid fa-code" style="color:#6366f1"></i> Embed A+ Picks Widget</h2>';
    h += '<p class="embed-sub">Add the DailyTickers A+ Picks widget to your website. Live prices update every 30s (stocks) / 15s (crypto).</p>';

    h += '<div class="embed-options">';
    h += '<div class="embed-opt active" id="optTape" onclick="selectLayout(\'tape\')">';
    h += '<i class="fa-solid fa-bars-staggered"></i><span>Ticker Tape</span><small>Horizontal scrolling bar</small></div>';
    h += '<div class="embed-opt" id="optVert" onclick="selectLayout(\'vertical\')">';
    h += '<i class="fa-solid fa-grip"></i><span>Watchlist</span><small>Vertical card grid</small></div>';
    h += '</div>';

    h += '<div id="themeSection">';
    h += '<h3 style="font-size:.72rem;font-weight:700;color:#334155;margin-bottom:8px"><i class="fa-solid fa-palette" style="color:#6366f1"></i> Theme</h3>';
    h += '<div class="embed-theme-row">';
    h += '<div class="embed-theme active" id="themeDark" onclick="selectTheme(\'dark\')">';
    h += '<div class="embed-theme-swatch" style="background:linear-gradient(135deg,#0f172a,#1e293b)"></div>';
    h += '<span>Dark</span></div>';
    h += '<div class="embed-theme" id="themeLight" onclick="selectTheme(\'light\')">';
    h += '<div class="embed-theme-swatch" style="background:#f1f5f9;border:1px solid #e2e8f0"></div>';
    h += '<span>Light</span></div>';
    h += '</div></div>';

    // Options
    h += '<div style="margin-bottom:14px;">';
    h += '<h3 style="font-size:.72rem;font-weight:700;color:#334155;margin-bottom:8px"><i class="fa-solid fa-sliders" style="color:#6366f1"></i> Options</h3>';
    h += '<label style="display:flex;align-items:center;gap:6px;font-size:.72rem;color:#334155;cursor:pointer;margin-bottom:6px;">';
    h += '<input type="checkbox" checked id="optPrice" onchange="updateEmbedCode()"> Live prices (Yahoo + Binance)</label>';
    h += '<label style="display:flex;align-items:center;gap:6px;font-size:.72rem;color:#334155;cursor:pointer;">';
    h += '<input type="checkbox" id="optAlert" onchange="updateEmbedCode()"> Browser notifications at key levels</label>';
    h += '</div>';

    h += '<div class="embed-section">';
    h += '<h3><i class="fa-solid fa-eye"></i> Preview</h3>';
    h += '<div class="embed-preview" id="embedPreview">';
    h += '<iframe src="/widget/?mode=tape&theme=dark" style="width:100%;height:38px;border:none;" id="previewFrame"></iframe>';
    h += '</div></div>';

    h += '<div class="embed-section">';
    h += '<h3><i class="fa-solid fa-terminal"></i> Embed Code</h3>';
    h += '<textarea class="embed-code" rows="3" id="embedCode" readonly>' + tapeCodeDark.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</textarea>';
    h += '<button class="embed-copy-btn" onclick="copyEmbedCode()"><i class="fa-solid fa-copy"></i> Copy Code</button>';
    h += '</div>';

    h += '<div class="embed-brand"><a href="https://articles.dailytickers.com/" target="_blank">';
    h += '<img src="https://articles.dailytickers.com/logo.svg" alt="MW"> DailyTickers</a></div>';
    h += '</div></div>';
    root.innerHTML = h;

    var currentLayout = 'tape', currentTheme = 'dark';

    window.selectLayout = function(layout) {
      currentLayout = layout;
      document.getElementById('optTape').className = 'embed-opt' + (layout==='tape'?' active':'');
      document.getElementById('optVert').className = 'embed-opt' + (layout==='vertical'?' active':'');
      document.getElementById('themeSection').style.display = layout==='tape'?'':'none';
      updateEmbedCode();
    };
    window.selectTheme = function(t) {
      currentTheme = t;
      document.getElementById('themeDark').className = 'embed-theme' + (t==='dark'?' active':'');
      document.getElementById('themeLight').className = 'embed-theme' + (t==='light'?' active':'');
      updateEmbedCode();
    };
    window.copyEmbedCode = function() {
      navigator.clipboard.writeText(document.getElementById('embedCode').value).then(function(){ toast('Embed code copied!'); });
    };
    window.updateEmbedCode = function() {
      var priceOn = document.getElementById('optPrice').checked;
      var alertOn = document.getElementById('optAlert').checked;
      var extraParams = '';
      if (!priceOn) extraParams += '&price=false';
      if (alertOn) extraParams += '&alert=true';

      var previewSrc, previewStyle, code;
      if (currentLayout === 'tape') {
        previewSrc = '/widget/?mode=tape&theme='+currentTheme+extraParams;
        previewStyle = 'width:100%;height:38px;border:none;';
        code = '<iframe src="'+base+'?mode=tape&theme='+currentTheme+extraParams+'" style="width:100%;height:38px;border:none;" title="DailyTickers A+ Picks"></iframe>';
      } else {
        previewSrc = '/widget/?mode=vertical'+extraParams;
        previewStyle = 'width:100%;height:400px;border:none;border-radius:8px;';
        code = '<iframe src="'+base+'?mode=vertical'+extraParams+'" style="width:380px;height:600px;border:none;border-radius:12px;" title="DailyTickers A+ Picks"></iframe>';
      }
      document.getElementById('embedCode').value = code;
      document.getElementById('previewFrame').src = previewSrc;
      document.getElementById('previewFrame').style.cssText = previewStyle;
    };
  }

  // ══════ Boot ══════
  fetch(WATCHLIST_URL).then(function(r){ return r.json(); }).then(function(data){
    // Normalize: watchlist.json uses "symbol" but widget expects "ticker"
    if (data.picks) {
      data.picks.forEach(function(p) {
        if (!p.ticker && p.symbol) p.ticker = p.symbol;
      });
    }
    watchlistData = data;
    window._copyChat = function(){ copyForChat(data); };
    if (mode === 'embed') { renderEmbedPage(data); return; }
    if (mode === 'vertical') renderVertical(data);
    else renderTape(data);
    // Start live price tracking
    if (showPrice && data.picks && data.picks.length) {
      requestAlertPermission();
      startPolling(data.picks);
    }
  }).catch(function(){
    document.getElementById('root').innerHTML = '<div style="text-align:center;padding:12px;color:#94a3b8;font-size:.7rem">Unable to load data</div>';
  });
})();
</script>
</body>
</html>
