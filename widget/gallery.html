<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Watch — Widget Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ══════════════════════════════════════
   SHARED VARIABLES
   ══════════════════════════════════════ */
:root{
  --bg-dark:#0f172a;--bg-dark-card:#1e293b;--bg-dark-hover:#334155;
  --bg-light:#f8fafc;--bg-light-card:#ffffff;--bg-light-hover:#f1f5f9;
  --accent:#6366f1;--accent-hover:#4f46e5;--accent-soft:rgba(99,102,241,.1);
  --pos:#10b981;--neg:#ef4444;--warn:#f59e0b;--orange:#f97316;
  --text-dark:#e2e8f0;--text-dark-muted:#94a3b8;
  --text-light:#0f172a;--text-light-muted:#64748b;
  --border-dark:#334155;--border-light:#e2e8f0;
  --radius:12px;--radius-sm:8px;
}

/* ══════════════════════════════════════
   GALLERY PAGE (default / ?type=embed)
   ══════════════════════════════════════ */
body.gallery-mode{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#f8fafc;color:#0f172a;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.g-header{
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
  padding:40px 24px 48px;text-align:center;position:relative;overflow:hidden;
}
.g-header::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 50%,rgba(99,102,241,.15),transparent 60%),
             radial-gradient(circle at 70% 50%,rgba(139,92,246,.1),transparent 60%);
}
.g-header-inner{position:relative;z-index:1;max-width:800px;margin:0 auto}
.g-brand{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px}
.g-brand img{height:28px}
.g-brand span{font-size:.72rem;font-weight:800;color:#e2e8f0;letter-spacing:.06em;text-transform:uppercase}
.g-header h1{font-size:1.8rem;font-weight:900;color:#fff;margin-bottom:8px;letter-spacing:-.02em}
.g-header p{font-size:.88rem;color:#94a3b8;max-width:500px;margin:0 auto}

.g-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:20px;max-width:1100px;margin:-28px auto 40px;padding:0 20px;position:relative;z-index:2;
}

.g-card{
  background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;
  transition:transform .2s,box-shadow .2s;cursor:pointer;
}
.g-card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.08)}
.g-card-head{
  display:flex;align-items:center;gap:10px;padding:16px 18px 12px;
}
.g-card-icon{
  width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:1rem;color:#fff;flex-shrink:0;
}
.g-card-icon.dashboard{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.g-card-icon.sector{background:linear-gradient(135deg,#10b981,#06b6d4)}
.g-card-icon.movers{background:linear-gradient(135deg,#f59e0b,#f97316)}
.g-card-icon.picks{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.g-card-icon.regime{background:linear-gradient(135deg,#3b82f6,#6366f1)}
.g-card-icon.radar{background:linear-gradient(135deg,#ef4444,#f97316)}
.g-card-title{font-size:.92rem;font-weight:800;color:#0f172a}
.g-card-desc{font-size:.68rem;color:#64748b;line-height:1.4}
.g-card-preview{
  margin:0 14px 14px;border-radius:10px;overflow:hidden;
  background:#0f172a;position:relative;min-height:160px;
}
.g-card-preview.light-preview{background:#f1f5f9}
.g-card-actions{
  display:flex;align-items:center;gap:8px;padding:0 18px 16px;
}
.g-btn{
  font-family:'Inter',sans-serif;font-size:.68rem;font-weight:700;padding:8px 16px;
  border-radius:8px;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px;
}
.g-btn-primary{background:#6366f1;color:#fff}
.g-btn-primary:hover{background:#4f46e5}
.g-btn-ghost{background:transparent;color:#64748b;border:1px solid #e2e8f0}
.g-btn-ghost:hover{color:#6366f1;border-color:#a5b4fc;background:#eef2ff}

/* Embed modal overlay */
.g-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(4px);
}
.g-modal-overlay.show{display:flex}
.g-modal{
  background:#fff;border-radius:16px;max-width:560px;width:100%;
  padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.15);position:relative;
  max-height:90vh;overflow-y:auto;
}
.g-modal-close{
  position:absolute;top:14px;right:14px;background:none;border:none;
  font-size:1.1rem;color:#94a3b8;cursor:pointer;padding:4px;
}
.g-modal-close:hover{color:#0f172a}
.g-modal h3{font-size:1rem;font-weight:800;color:#0f172a;margin-bottom:4px}
.g-modal .g-modal-sub{font-size:.72rem;color:#64748b;margin-bottom:18px}
.g-modal-section{margin-bottom:16px}
.g-modal-section h4{font-size:.76rem;font-weight:700;color:#334155;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.g-modal-section h4 i{color:#6366f1;font-size:.72rem}
.g-modal-opts{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.g-modal-opt{
  flex:1;min-width:80px;padding:10px;border:2px solid #e2e8f0;border-radius:10px;
  cursor:pointer;text-align:center;transition:all .15s;background:#fff;
}
.g-modal-opt:hover{border-color:#a5b4fc}
.g-modal-opt.active{border-color:#6366f1;background:#eef2ff}
.g-modal-opt i{font-size:1rem;color:#6366f1;display:block;margin-bottom:4px}
.g-modal-opt span{font-size:.62rem;font-weight:700;color:#334155;display:block}
.g-embed-code{
  width:100%;font-family:'Inter',monospace;font-size:.6rem;background:#0f172a;
  color:#a5b4fc;border:none;border-radius:8px;padding:12px;resize:none;line-height:1.6;
}
.g-embed-preview{
  background:#f1f5f9;border:1px solid #e2e8f0;border-radius:10px;
  padding:12px;margin-bottom:10px;overflow:hidden;text-align:center;
}
.g-embed-preview iframe{border:none;border-radius:8px}

.g-footer{
  text-align:center;padding:24px;border-top:1px solid #e2e8f0;margin-top:20px;
}
.g-footer a{font-size:.7rem;color:#94a3b8;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.g-footer a:hover{color:#6366f1}
.g-footer img{height:16px;opacity:.5}

@media(max-width:720px){
  .g-grid{grid-template-columns:1fr;padding:0 12px}
  .g-header h1{font-size:1.3rem}
  .g-header{padding:28px 16px 40px}
}

/* ══════════════════════════════════════
   WIDGET STANDALONE MODE (dark default)
   ══════════════════════════════════════ */
body.widget-mode{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;margin:0;padding:0;
}
body.widget-mode.theme-dark{background:var(--bg-dark);color:var(--text-dark)}
body.widget-mode.theme-light{background:var(--bg-light);color:var(--text-light)}

/* ── Shared widget chrome ── */
.w-wrap{padding:12px;min-height:100vh}
.w-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.w-brand{display:flex;align-items:center;gap:6px;text-decoration:none}
.w-brand img{height:16px}
.theme-dark .w-brand span{font-size:.58rem;font-weight:800;color:#e2e8f0;letter-spacing:.04em}
.theme-light .w-brand span{font-size:.58rem;font-weight:800;color:#0f172a;letter-spacing:.04em}
.w-updated{font-size:.52rem;color:var(--text-dark-muted)}
.theme-light .w-updated{color:var(--text-light-muted)}
.w-loading{
  display:flex;align-items:center;justify-content:center;
  min-height:120px;font-size:.72rem;color:#94a3b8;gap:8px;
}
.w-loading i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.w-footer{text-align:center;padding:8px 0 4px}
.w-footer a{font-size:.52rem;color:#64748b;text-decoration:none}
.w-footer a:hover{color:var(--accent)}

/* ── DASHBOARD widget ── */
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dash-card{
  padding:10px 12px;border-radius:var(--radius-sm);transition:transform .15s;
}
.theme-dark .dash-card{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .dash-card{background:var(--bg-light-card);border:1px solid var(--border-light)}
.dash-card:hover{transform:scale(1.02)}
.dash-label{font-size:.52rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.theme-dark .dash-label{color:var(--text-dark-muted)}
.theme-light .dash-label{color:var(--text-light-muted)}
.dash-price{font-size:.88rem;font-weight:800;font-family:'Inter',monospace;margin-bottom:1px}
.theme-dark .dash-price{color:#fff}
.theme-light .dash-price{color:#0f172a}
.dash-chg{font-size:.58rem;font-weight:700;display:flex;align-items:center;gap:3px}
.dash-chg.up{color:var(--pos)}
.dash-chg.down{color:var(--neg)}
.dash-chg.flat{color:#94a3b8}
.dash-regime{
  grid-column:1/-1;padding:12px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:space-between;
}
.theme-dark .dash-regime{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .dash-regime{background:var(--bg-light-card);border:1px solid var(--border-light)}
.dash-regime-left{display:flex;align-items:center;gap:10px}
.dash-regime-dot{
  width:10px;height:10px;border-radius:50%;animation:pulse-dot 2s infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
.dash-regime-label{font-size:.72rem;font-weight:800;text-transform:uppercase}
.dash-regime-sub{font-size:.54rem;color:#94a3b8}
.dash-regime-vix{text-align:right}
.dash-regime-vix-val{font-size:.82rem;font-weight:800;font-family:'Inter',monospace}
.dash-regime-vix-label{font-size:.48rem;color:#94a3b8;text-transform:uppercase}

/* ── SECTOR widget ── */
.sector-list{display:flex;flex-direction:column;gap:6px}
.sector-row{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);
}
.theme-dark .sector-row{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .sector-row{background:var(--bg-light-card);border:1px solid var(--border-light)}
.sector-name{font-size:.62rem;font-weight:700;width:100px;flex-shrink:0}
.sector-bar-wrap{flex:1;height:14px;background:rgba(148,163,184,.1);border-radius:4px;overflow:hidden;position:relative}
.sector-bar{height:100%;border-radius:4px;min-width:2px;transition:width .6s ease}
.sector-bar.pos{background:linear-gradient(90deg,#10b981,#34d399)}
.sector-bar.neg{background:linear-gradient(90deg,#ef4444,#f87171);float:right}
.sector-pct{font-size:.62rem;font-weight:800;width:56px;text-align:right;font-family:'Inter',monospace}
.sector-pct.up{color:var(--pos)}
.sector-pct.down{color:var(--neg)}

/* ── MOVERS widget ── */
.movers-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.movers-col h3{
  font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  margin-bottom:8px;display:flex;align-items:center;gap:5px;
}
.movers-col h3.gainers{color:var(--pos)}
.movers-col h3.losers{color:var(--neg)}
.movers-item{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);
  margin-bottom:4px;
}
.theme-dark .movers-item{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .movers-item{background:var(--bg-light-card);border:1px solid var(--border-light)}
.movers-rank{font-size:.56rem;font-weight:800;color:#94a3b8;width:14px;flex-shrink:0}
.movers-ticker{font-size:.7rem;font-weight:800;flex:1}
.theme-dark .movers-ticker{color:#fff}
.theme-light .movers-ticker{color:#0f172a}
.movers-price{font-size:.6rem;color:#94a3b8;font-family:'Inter',monospace}
.movers-pct{font-size:.62rem;font-weight:800;font-family:'Inter',monospace;width:56px;text-align:right}
.movers-pct.up{color:var(--pos)}
.movers-pct.down{color:var(--neg)}

/* ── REGIME widget ── */
.regime-card{
  border-radius:var(--radius);padding:20px;text-align:center;position:relative;overflow:hidden;
}
.theme-dark .regime-card{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .regime-card{background:var(--bg-light-card);border:1px solid var(--border-light)}
.regime-dot{
  width:16px;height:16px;border-radius:50%;margin:0 auto 10px;
  animation:pulse-dot 2s infinite;box-shadow:0 0 12px currentColor;
}
.regime-label{font-size:1.1rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.regime-metrics{display:flex;justify-content:center;gap:24px;margin-top:14px}
.regime-metric{text-align:center}
.regime-metric-val{font-size:.92rem;font-weight:800;font-family:'Inter',monospace}
.regime-metric-label{font-size:.48rem;color:#94a3b8;text-transform:uppercase;font-weight:600}

/* ── RADAR widget ── */
.radar-list{display:flex;flex-direction:column;gap:6px}
.radar-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);
  text-decoration:none;color:inherit;transition:transform .15s;
}
.radar-item:hover{transform:translateX(3px)}
.theme-dark .radar-item{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .radar-item{background:var(--bg-light-card);border:1px solid var(--border-light)}
.radar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.radar-dot.risk{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,.4)}
.radar-dot.event{background:#f59e0b;box-shadow:0 0 6px rgba(245,158,11,.4)}
.radar-dot.opportunity{background:#10b981;box-shadow:0 0 6px rgba(16,185,129,.4)}
.radar-dot.regime{background:#3b82f6;box-shadow:0 0 6px rgba(59,130,246,.4)}
.radar-label{flex:1;font-size:.66rem;font-weight:600}
.theme-dark .radar-label{color:#e2e8f0}
.theme-light .radar-label{color:#0f172a}
.radar-imp{width:48px;height:5px;background:rgba(148,163,184,.15);border-radius:3px;overflow:hidden;flex-shrink:0}
.radar-imp-fill{height:100%;border-radius:3px}
.radar-cat{font-size:.48rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;width:32px;text-align:right;flex-shrink:0}

/* ── PICKS widget (redirect notice) ── */
.picks-notice{
  text-align:center;padding:40px 20px;
}
.picks-notice i{font-size:2rem;color:var(--accent);margin-bottom:12px}
.picks-notice h3{font-size:.88rem;font-weight:800;margin-bottom:6px}
.theme-dark .picks-notice h3{color:#fff}
.theme-light .picks-notice h3{color:#0f172a}
.picks-notice p{font-size:.68rem;color:#94a3b8;margin-bottom:16px}
.picks-link{
  display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;
  color:#fff;background:var(--accent);padding:10px 20px;border-radius:var(--radius-sm);
  text-decoration:none;transition:background .15s;
}
.picks-link:hover{background:var(--accent-hover)}

/* ── Responsive ── */
@media(max-width:480px){
  .dash-grid{grid-template-columns:repeat(2,1fr)}
  .movers-cols{grid-template-columns:1fr}
  .regime-metrics{gap:14px}
  .sector-name{width:72px;font-size:.56rem}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
  'use strict';

  /* ══════ CONFIG ══════ */
  var YAHOO_PROXY = 'https://api.allorigins.win/get?url=';
  var BINANCE_API = 'https://api.binance.com/api/v3/ticker/24hr';
  var RADAR_URL = '/data/radar.json';
  var WATCHLIST_URL = '/mcp/watchlist.json';
  var CACHE_TTL = 5 * 60 * 1000; // 5 min
  var STOCK_REFRESH = 30000;
  var CRYPTO_REFRESH = 15000;
  var BASE_URL = 'https://articles.market-watch.xyz';

  var DASHBOARD_SYMBOLS = [
    { sym: 'SPY',       label: 'S&P 500',   type: 'stock' },
    { sym: 'QQQ',       label: 'Nasdaq 100', type: 'stock' },
    { sym: 'DIA',       label: 'Dow Jones',  type: 'stock' },
    { sym: 'IWM',       label: 'Russell 2K', type: 'stock' },
    { sym: '^VIX',      label: 'VIX',        type: 'stock', isVix: true },
    { sym: 'DX-Y.NYB',  label: 'DXY',        type: 'stock' },
    { sym: 'GC=F',      label: 'Gold',       type: 'stock' },
    { sym: 'CL=F',      label: 'Oil (WTI)',  type: 'stock' },
    { sym: 'BTC-USD',   label: 'Bitcoin',    type: 'crypto' },
    { sym: 'ETH-USD',   label: 'Ethereum',   type: 'crypto' },
  ];

  var SECTOR_ETFS = [
    { sym: 'XLK', label: 'Technology' },
    { sym: 'XLV', label: 'Healthcare' },
    { sym: 'XLF', label: 'Financials' },
    { sym: 'XLE', label: 'Energy' },
    { sym: 'XLI', label: 'Industrials' },
    { sym: 'XLY', label: 'Consumer Disc.' },
    { sym: 'XLP', label: 'Consumer Stpl.' },
    { sym: 'XLRE', label: 'Real Estate' },
    { sym: 'XLU', label: 'Utilities' },
    { sym: 'XLB', label: 'Materials' },
  ];

  var MOVERS_UNIVERSE = [
    'AAPL','MSFT','AMZN','GOOGL','META','NVDA','TSLA','AMD','NFLX','CRM',
    'ADBE','INTC','BA','JPM','GS','XOM','CVX','PFE','JNJ','UNH',
    'HD','WMT','DIS','NKE','PYPL','SQ','COIN','MSTR','PLTR','SOFI'
  ];

  /* ══════ PARAMS ══════ */
  var params = new URLSearchParams(location.search);
  var widgetType = params.get('type') || 'gallery';
  var theme = params.get('theme') || 'dark';
  var showPrice = params.get('price') !== 'false';

  var root = document.getElementById('root');

  /* ══════ CACHE ══════ */
  function cacheGet(key) {
    try {
      var raw = sessionStorage.getItem('mw_' + key);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (Date.now() - obj.ts > CACHE_TTL) { sessionStorage.removeItem('mw_' + key); return null; }
      return obj.data;
    } catch(e) { return null; }
  }
  function cacheSet(key, data) {
    try { sessionStorage.setItem('mw_' + key, JSON.stringify({ ts: Date.now(), data: data })); } catch(e) {}
  }

  /* ══════ FETCH HELPERS ══════ */
  function fetchYahoo(symbols) {
    var syms = Array.isArray(symbols) ? symbols : [symbols];
    var cacheKey = 'yf_' + syms.sort().join(',');
    var cached = cacheGet(cacheKey);
    if (cached) return Promise.resolve(cached);

    var url = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=' + encodeURIComponent(syms.join(','));
    var proxyUrl = YAHOO_PROXY + encodeURIComponent(url);

    return fetch(proxyUrl)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var parsed = JSON.parse(d.contents);
        var results = {};
        var quotes = (parsed.quoteResponse && parsed.quoteResponse.result) || [];
        quotes.forEach(function(q) {
          results[q.symbol] = {
            price: q.regularMarketPrice || 0,
            chg: q.regularMarketChange || 0,
            chgPct: q.regularMarketChangePercent || 0,
            prevClose: q.regularMarketPreviousClose || 0,
            name: q.shortName || q.symbol
          };
        });
        cacheSet(cacheKey, results);
        return results;
      })
      .catch(function() { return {}; });
  }

  function fetchBinance(symbol) {
    var pair = symbol.replace('-USD', 'USDT');
    var cacheKey = 'bn_' + pair;
    var cached = cacheGet(cacheKey);
    if (cached) return Promise.resolve(cached);

    return fetch(BINANCE_API + '?symbol=' + pair)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var result = {
          price: parseFloat(d.lastPrice),
          chg: parseFloat(d.priceChange),
          chgPct: parseFloat(d.priceChangePercent),
          name: symbol
        };
        cacheSet(cacheKey, result);
        return result;
      })
      .catch(function() { return null; });
  }

  /* ══════ UTILS ══════ */
  function fmt(n, dec) {
    if (n == null || isNaN(n)) return '--';
    dec = dec != null ? dec : 2;
    if (Math.abs(n) >= 1000) return n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return n.toFixed(dec);
  }
  function fmtPct(n) {
    if (n == null || isNaN(n)) return '--';
    return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  }
  function chgClass(n) { return n > 0.01 ? 'up' : n < -0.01 ? 'down' : 'flat'; }
  function chgArrow(n) { return n > 0.01 ? '<i class="fas fa-caret-up"></i>' : n < -0.01 ? '<i class="fas fa-caret-down"></i>' : ''; }

  function regimeFromVix(vix) {
    if (vix < 15) return { label: 'RISK-ON', color: '#10b981' };
    if (vix < 20) return { label: 'NEUTRAL', color: '#f59e0b' };
    if (vix < 28) return { label: 'EARLY RISK-OFF', color: '#f97316' };
    return { label: 'RISK-OFF', color: '#ef4444' };
  }
  function fearGreedFromVix(vix) {
    // Rough inverse mapping: VIX 10→90 F&G, VIX 40→5 F&G
    var fg = Math.round(Math.max(0, Math.min(100, 100 - (vix - 10) * 3)));
    return fg;
  }

  function loadDashboard() {
    var stockSyms = DASHBOARD_SYMBOLS.filter(function(s){ return s.type==='stock'; }).map(function(s){ return s.sym; });
    var cryptoSyms = DASHBOARD_SYMBOLS.filter(function(s){ return s.type==='crypto'; });

    var promises = [fetchYahoo(stockSyms)];
    cryptoSyms.forEach(function(c) { promises.push(fetchBinance(c.sym)); });

    Promise.all(promises).then(function(results) {
      var stockData = results[0] || {};
      var cryptoIdx = 0;
      cryptoSyms.forEach(function(c) {
        var d = results[1 + cryptoIdx];
        if (d) stockData[c.sym] = d;
        cryptoIdx++;
      });

      var vixData = stockData['^VIX'];
      var vixVal = vixData ? vixData.price : 20;
      var regime = regimeFromVix(vixVal);
      var fg = fearGreedFromVix(vixVal);

      var html = '<div class="dash-grid">';

      // Regime bar
      html += '<div class="dash-regime">';
      html += '<div class="dash-regime-left">';
      html += '<div class="dash-regime-dot" style="background:' + regime.color + ';box-shadow:0 0 10px ' + regime.color + '"></div>';
      html += '<div><div class="dash-regime-label" style="color:' + regime.color + '">' + regime.label + '</div>';
      html += '<div class="dash-regime-sub">Fear & Greed: ' + fg + '/100</div></div>';
      html += '</div>';
      html += '<div class="dash-regime-vix"><div class="dash-regime-vix-val" style="color:' + regime.color + '">' + fmt(vixVal, 1) + '</div><div class="dash-regime-vix-label">VIX</div></div>';
      html += '</div>';

      DASHBOARD_SYMBOLS.forEach(function(s) {
        var d = stockData[s.sym];
        if (!d) {
          html += '<div class="dash-card"><div class="dash-label">' + s.label + '</div><div class="dash-price">--</div><div class="dash-chg flat">--</div></div>';
          return;
        }
        var cls = chgClass(d.chgPct);
        var arrow = chgArrow(d.chgPct);
        var dec = (s.sym === 'BTC-USD') ? 0 : (s.sym === 'ETH-USD' ? 1 : 2);
        if (s.isVix) dec = 1;

        html += '<div class="dash-card">';
        html += '<div class="dash-label">' + s.label + '</div>';
        html += '<div class="dash-price">' + (s.isVix ? '' : '$') + fmt(d.price, dec) + '</div>';
        html += '<div class="dash-chg ' + cls + '">' + arrow + ' ' + fmtPct(d.chgPct) + '</div>';
        html += '</div>';
      });

      html += '</div>';
      document.getElementById('dashContent').innerHTML = html;
      document.getElementById('dashUpdated').textContent = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });

      // Schedule refresh
      setTimeout(loadDashboard, STOCK_REFRESH);
    });
  }

  function loadSectors() {
    var syms = SECTOR_ETFS.map(function(s){ return s.sym; });
    fetchYahoo(syms).then(function(data) {
      var items = SECTOR_ETFS.map(function(s) {
        var d = data[s.sym];
        return { label: s.label, sym: s.sym, chgPct: d ? d.chgPct : 0 };
      });
      items.sort(function(a, b) { return b.chgPct - a.chgPct; });

      var maxAbs = Math.max.apply(null, items.map(function(i){ return Math.abs(i.chgPct); }));
      if (maxAbs < 0.01) maxAbs = 1;

      var html = '<div class="sector-list">';
      items.forEach(function(item) {
        var pct = item.chgPct;
        var cls = chgClass(pct);
        var barW = Math.max(2, Math.abs(pct) / maxAbs * 100);
        var barCls = pct >= 0 ? 'pos' : 'neg';
        html += '<div class="sector-row">';
        html += '<div class="sector-name">' + item.label + '</div>';
        html += '<div class="sector-bar-wrap"><div class="sector-bar ' + barCls + '" style="width:' + barW + '%"></div></div>';
        html += '<div class="sector-pct ' + cls + '">' + fmtPct(pct) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      document.getElementById('sectorContent').innerHTML = html;
      document.getElementById('sectorUpdated').textContent = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
      setTimeout(loadSectors, STOCK_REFRESH);
    });
  }

    case 'movers':    renderMovers(); break;
    case 'picks':     renderPicks(); break;
    case 'regime':    renderRegime(); break;
    case 'radar':     renderRadar(); break;
    default:          renderGallery(); break;
  }

})();
</script>
