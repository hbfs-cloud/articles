<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyTickers — Widget Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg-dark:#0f172a;--bg-dark-card:#1e293b;--bg-dark-hover:#334155;
  --bg-light:#f8fafc;--bg-light-card:#ffffff;--bg-light-hover:#f1f5f9;
  --accent:#6366f1;--accent-hover:#4f46e5;--accent-soft:rgba(99,102,241,.1);
  --pos:#10b981;--neg:#ef4444;--warn:#f59e0b;--orange:#f97316;
  --text-dark:#e2e8f0;--text-dark-muted:#94a3b8;
  --text-light:#0f172a;--text-light-muted:#64748b;
  --border-dark:#334155;--border-light:#e2e8f0;
  --radius:12px;--radius-sm:8px;
}

/* ══════ GALLERY PAGE ══════ */
body.gallery-mode{
  font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#0f172a;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.g-header{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  padding:40px 24px 48px;text-align:center;position:relative;overflow:hidden;
}
.g-header::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 50%,rgba(99,102,241,.15),transparent 60%),
             radial-gradient(circle at 70% 50%,rgba(139,92,246,.1),transparent 60%);
}
.g-header-inner{position:relative;z-index:1;max-width:800px;margin:0 auto}
.g-brand{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px}
.g-brand img{height:28px}
.g-brand span{font-size:.72rem;font-weight:800;color:#e2e8f0;letter-spacing:.06em;text-transform:uppercase}
.g-header h1{font-size:1.8rem;font-weight:900;color:#fff;margin-bottom:8px;letter-spacing:-.02em}
.g-header p{font-size:.88rem;color:#94a3b8;max-width:500px;margin:0 auto}
.g-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:20px;max-width:1100px;margin:-28px auto 40px;padding:0 20px;position:relative;z-index:2;
}
.g-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.g-card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.08)}
.g-card-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
.g-card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff;flex-shrink:0}
.g-card-icon.dashboard{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.g-card-icon.sector{background:linear-gradient(135deg,#10b981,#06b6d4)}
.g-card-icon.movers{background:linear-gradient(135deg,#f59e0b,#f97316)}
.g-card-icon.picks{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.g-card-icon.regime{background:linear-gradient(135deg,#3b82f6,#6366f1)}
.g-card-icon.radar{background:linear-gradient(135deg,#ef4444,#f97316)}
.g-card-title{font-size:.92rem;font-weight:800;color:#0f172a}
.g-card-desc{font-size:.68rem;color:#64748b;line-height:1.4}
.g-card-preview{
  margin:0 14px 14px;border-radius:10px;overflow:hidden;
  background:#0f172a;position:relative;min-height:140px;padding:12px;
}
.g-card-actions{display:flex;align-items:center;gap:8px;padding:0 18px 16px}
.g-btn{
  font-family:'Inter',sans-serif;font-size:.68rem;font-weight:700;padding:8px 16px;
  border-radius:8px;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px;
}
.g-btn-primary{background:#6366f1;color:#fff}
.g-btn-primary:hover{background:#4f46e5}
.g-btn-ghost{background:transparent;color:#64748b;border:1px solid #e2e8f0}
.g-btn-ghost:hover{color:#6366f1;border-color:#a5b4fc;background:#eef2ff}

/* Skeleton preview */
.skel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.skel-item{background:#1e293b;border-radius:6px;padding:8px}
.skel-bar{height:6px;border-radius:3px;background:#334155;margin-top:4px}
.skel-label{height:5px;width:40px;border-radius:2px;background:#334155;margin-bottom:4px}
.skel-val{height:10px;width:50px;border-radius:3px;background:#475569}
.skel-row{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#1e293b;border-radius:6px;margin-bottom:4px}
.skel-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.skel-text{flex:1;height:6px;border-radius:3px;background:#334155}
.skel-regime{background:#1e293b;border-radius:6px;padding:12px;text-align:center;margin-bottom:8px}
.skel-regime .skel-dot{width:12px;height:12px;margin:0 auto 6px}

/* Modal */
.g-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.g-modal-overlay.show{display:flex}
.g-modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.15);position:relative;max-height:90vh;overflow-y:auto}
.g-modal-close{position:absolute;top:14px;right:14px;background:none;border:none;font-size:1.1rem;color:#94a3b8;cursor:pointer;padding:4px}
.g-modal-close:hover{color:#0f172a}
.g-modal h3{font-size:1rem;font-weight:800;color:#0f172a;margin-bottom:4px}
.g-modal .g-modal-sub{font-size:.72rem;color:#64748b;margin-bottom:18px}
.g-modal-section{margin-bottom:16px}
.g-modal-section h4{font-size:.76rem;font-weight:700;color:#334155;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.g-modal-section h4 i{color:#6366f1;font-size:.72rem}
.g-modal-opts{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.g-modal-opt{flex:1;min-width:80px;padding:10px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;text-align:center;transition:all .15s;background:#fff}
.g-modal-opt:hover{border-color:#a5b4fc}
.g-modal-opt.active{border-color:#6366f1;background:#eef2ff}
.g-modal-opt i{font-size:1rem;color:#6366f1;display:block;margin-bottom:4px}
.g-modal-opt span{font-size:.62rem;font-weight:700;color:#334155;display:block}
.g-embed-code{width:100%;font-family:'Inter',monospace;font-size:.6rem;background:#0f172a;color:#a5b4fc;border:none;border-radius:8px;padding:12px;resize:none;line-height:1.6}
.g-embed-preview{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px;overflow:hidden;text-align:center}
.g-embed-preview iframe{border:none;border-radius:8px}
.g-footer{text-align:center;padding:24px;border-top:1px solid #e2e8f0;margin-top:20px}
.g-footer a{font-size:.7rem;color:#94a3b8;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.g-footer a:hover{color:#6366f1}
.g-footer img{height:16px;opacity:.5}

@media(max-width:720px){
  .g-grid{grid-template-columns:1fr;padding:0 12px}
  .g-header h1{font-size:1.3rem}
  .g-header{padding:28px 16px 40px}
}

/* ══════ WIDGET STANDALONE MODE ══════ */
body.widget-mode{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;margin:0;padding:0}
body.widget-mode.theme-dark{background:var(--bg-dark);color:var(--text-dark)}
body.widget-mode.theme-light{background:var(--bg-light);color:var(--text-light)}
.w-wrap{padding:12px;min-height:100vh}
.w-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.w-brand{display:flex;align-items:center;gap:6px;text-decoration:none}
.w-brand img{height:16px}
.theme-dark .w-brand span{font-size:.58rem;font-weight:800;color:#e2e8f0;letter-spacing:.04em}
.theme-light .w-brand span{font-size:.58rem;font-weight:800;color:#0f172a;letter-spacing:.04em}
.w-updated{font-size:.52rem;color:var(--text-dark-muted)}
.theme-light .w-updated{color:var(--text-light-muted)}
.w-loading{display:flex;align-items:center;justify-content:center;min-height:120px;font-size:.72rem;color:#94a3b8;gap:8px}
.w-loading i{animation:spin 1s linear infinite}
.w-error{text-align:center;padding:24px;font-size:.72rem;color:#f59e0b}
@keyframes spin{to{transform:rotate(360deg)}}
.w-footer{text-align:center;padding:8px 0 4px}
.w-footer a{font-size:.52rem;color:#64748b;text-decoration:none}
.w-footer a:hover{color:var(--accent)}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dash-card{padding:10px 12px;border-radius:var(--radius-sm);transition:transform .15s}
.theme-dark .dash-card{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .dash-card{background:var(--bg-light-card);border:1px solid var(--border-light)}
.dash-card:hover{transform:scale(1.02)}
.dash-label{font-size:.52rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.theme-dark .dash-label{color:var(--text-dark-muted)}
.theme-light .dash-label{color:var(--text-light-muted)}
.dash-price{font-size:.88rem;font-weight:800;font-family:'Inter',monospace;margin-bottom:1px}
.theme-dark .dash-price{color:#fff}
.theme-light .dash-price{color:#0f172a}
.dash-chg{font-size:.58rem;font-weight:700;display:flex;align-items:center;gap:3px}
.dash-chg.up{color:var(--pos)}
.dash-chg.down{color:var(--neg)}
.dash-chg.flat{color:#94a3b8}
.dash-regime{grid-column:1/-1;padding:12px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:space-between}
.theme-dark .dash-regime{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .dash-regime{background:var(--bg-light-card);border:1px solid var(--border-light)}
.dash-regime-left{display:flex;align-items:center;gap:10px}
.dash-regime-dot{width:10px;height:10px;border-radius:50%;animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
.dash-regime-label{font-size:.72rem;font-weight:800;text-transform:uppercase}
.dash-regime-sub{font-size:.54rem;color:#94a3b8}
.dash-regime-vix{text-align:right}
.dash-regime-vix-val{font-size:.82rem;font-weight:800;font-family:'Inter',monospace}
.dash-regime-vix-label{font-size:.48rem;color:#94a3b8;text-transform:uppercase}

/* Sector */
.sector-list{display:flex;flex-direction:column;gap:6px}
.sector-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm)}
.theme-dark .sector-row{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .sector-row{background:var(--bg-light-card);border:1px solid var(--border-light)}
.sector-name{font-size:.62rem;font-weight:700;width:100px;flex-shrink:0}
.sector-bar-wrap{flex:1;height:14px;background:rgba(148,163,184,.1);border-radius:4px;overflow:hidden;position:relative}
.sector-bar{height:100%;border-radius:4px;min-width:2px;transition:width .6s ease}
.sector-bar.pos{background:linear-gradient(90deg,#10b981,#34d399)}
.sector-bar.neg{background:linear-gradient(90deg,#ef4444,#f87171);float:right}
.sector-pct{font-size:.62rem;font-weight:800;width:56px;text-align:right;font-family:'Inter',monospace}
.sector-pct.up{color:var(--pos)}
.sector-pct.down{color:var(--neg)}

/* Movers */
.movers-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.movers-col h3{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.movers-col h3.gainers{color:var(--pos)}
.movers-col h3.losers{color:var(--neg)}
.movers-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);margin-bottom:4px}
.theme-dark .movers-item{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .movers-item{background:var(--bg-light-card);border:1px solid var(--border-light)}
.movers-rank{font-size:.56rem;font-weight:800;color:#94a3b8;width:14px;flex-shrink:0}
.movers-ticker{font-size:.7rem;font-weight:800;flex:1}
.theme-dark .movers-ticker{color:#fff}
.theme-light .movers-ticker{color:#0f172a}
.movers-price{font-size:.6rem;color:#94a3b8;font-family:'Inter',monospace}
.movers-pct{font-size:.62rem;font-weight:800;font-family:'Inter',monospace;width:56px;text-align:right}
.movers-pct.up{color:var(--pos)}
.movers-pct.down{color:var(--neg)}

/* Regime */
.regime-card{border-radius:var(--radius);padding:20px;text-align:center;position:relative;overflow:hidden}
.theme-dark .regime-card{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .regime-card{background:var(--bg-light-card);border:1px solid var(--border-light)}
.regime-dot{width:16px;height:16px;border-radius:50%;margin:0 auto 10px;animation:pulse-dot 2s infinite;box-shadow:0 0 12px currentColor}
.regime-label{font-size:1.1rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.regime-metrics{display:flex;justify-content:center;gap:24px;margin-top:14px}
.regime-metric{text-align:center}
.regime-metric-val{font-size:.92rem;font-weight:800;font-family:'Inter',monospace}
.regime-metric-label{font-size:.48rem;color:#94a3b8;text-transform:uppercase;font-weight:600}

/* Radar */
.radar-list{display:flex;flex-direction:column;gap:6px}
.radar-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);text-decoration:none;color:inherit;transition:transform .15s}
.radar-item:hover{transform:translateX(3px)}
.theme-dark .radar-item{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .radar-item{background:var(--bg-light-card);border:1px solid var(--border-light)}
.radar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.radar-dot.risk{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,.4)}
.radar-dot.event{background:#f59e0b;box-shadow:0 0 6px rgba(245,158,11,.4)}
.radar-dot.opportunity{background:#10b981;box-shadow:0 0 6px rgba(16,185,129,.4)}
.radar-dot.regime{background:#3b82f6;box-shadow:0 0 6px rgba(59,130,246,.4)}
.radar-label{flex:1;font-size:.66rem;font-weight:600}
.theme-dark .radar-label{color:#e2e8f0}
.theme-light .radar-label{color:#0f172a}
.radar-imp{width:48px;height:5px;background:rgba(148,163,184,.15);border-radius:3px;overflow:hidden;flex-shrink:0}
.radar-imp-fill{height:100%;border-radius:3px}
.radar-cat{font-size:.48rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;width:32px;text-align:right;flex-shrink:0}

/* Crypto */
.crypto-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.crypto-card{padding:10px 12px;border-radius:var(--radius-sm);transition:transform .15s}
.theme-dark .crypto-card{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .crypto-card{background:var(--bg-light-card);border:1px solid var(--border-light)}
.crypto-card:hover{transform:scale(1.02)}
.crypto-card.featured{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:14px 16px}
.crypto-sym{font-size:.7rem;font-weight:800}
.theme-dark .crypto-sym{color:#fff}
.theme-light .crypto-sym{color:#0f172a}
.crypto-sym small{font-size:.52rem;font-weight:600;color:#94a3b8;margin-left:4px}
.crypto-price{font-size:.88rem;font-weight:800;font-family:'Inter',monospace}
.crypto-card.featured .crypto-price{font-size:1.1rem}
.theme-dark .crypto-price{color:#fff}
.theme-light .crypto-price{color:#0f172a}
.crypto-chg{font-size:.58rem;font-weight:700;display:flex;align-items:center;gap:3px}
.crypto-chg.up{color:var(--pos)}
.crypto-chg.down{color:var(--neg)}
.crypto-chg.flat{color:#94a3b8}
.crypto-status{text-align:center;font-size:.52rem;font-weight:600;color:#94a3b8;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:5px}
.crypto-status .live-dot{width:5px;height:5px;border-radius:50%;background:var(--pos);animation:pulse-dot 2s infinite}

/* Proxy / High Beta */
.proxy-grid{display:flex;flex-direction:column;gap:6px}
.proxy-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm)}
.theme-dark .proxy-row{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .proxy-row{background:var(--bg-light-card);border:1px solid var(--border-light)}
.proxy-theme{font-size:.48rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;width:40px;flex-shrink:0;text-align:center;padding:2px 4px;border-radius:4px}
.proxy-ticker{font-size:.66rem;font-weight:800;width:48px;flex-shrink:0}
.theme-dark .proxy-ticker{color:#fff}
.theme-light .proxy-ticker{color:#0f172a}
.proxy-name{font-size:.52rem;color:#94a3b8;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proxy-price{font-size:.6rem;font-weight:700;font-family:'Inter',monospace;width:54px;text-align:right;flex-shrink:0}
.theme-dark .proxy-price{color:#e2e8f0}
.theme-light .proxy-price{color:#0f172a}
.proxy-pct{font-size:.62rem;font-weight:800;font-family:'Inter',monospace;width:56px;text-align:right;flex-shrink:0}
.proxy-pct.up{color:var(--pos)}
.proxy-pct.down{color:var(--neg)}
.proxy-pct.flat{color:#94a3b8}

/* Regions */
.regions-section{margin-bottom:10px}
.regions-title{font-size:.56rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.regions-row{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.regions-item{padding:8px 10px;border-radius:var(--radius-sm)}
.theme-dark .regions-item{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .regions-item{background:var(--bg-light-card);border:1px solid var(--border-light)}
.regions-sym{font-size:.52rem;font-weight:600;color:#94a3b8}
.regions-val{font-size:.72rem;font-weight:800;font-family:'Inter',monospace}
.theme-dark .regions-val{color:#fff}
.theme-light .regions-val{color:#0f172a}
.regions-chg{font-size:.52rem;font-weight:700}
.regions-chg.up{color:var(--pos)}
.regions-chg.down{color:var(--neg)}

/* Market status */
.market-status{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.52rem;font-weight:600;padding:6px;border-radius:var(--radius-sm);margin-bottom:8px}
.market-status.open{color:var(--pos);background:rgba(16,185,129,.08)}
.market-status.closed{color:#f59e0b;background:rgba(245,158,11,.08)}
.market-status .status-dot{width:5px;height:5px;border-radius:50%}
.market-status.open .status-dot{background:var(--pos);animation:pulse-dot 2s infinite}
.market-status.closed .status-dot{background:#f59e0b}

/* Picks */
.picks-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:8px 10px;border-radius:var(--radius-sm)}
.theme-dark .picks-header{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .picks-header{background:var(--bg-light-card);border:1px solid var(--border-light)}
.picks-header-left{display:flex;align-items:center;gap:8px}
.picks-header-left i{font-size:.8rem;color:var(--accent)}
.picks-header-title{font-size:.72rem;font-weight:800}
.theme-dark .picks-header-title{color:#fff}
.theme-light .picks-header-title{color:#0f172a}
.picks-header-meta{font-size:.48rem;color:#94a3b8;font-weight:600}
.picks-regime{font-size:.48rem;font-weight:800;padding:2px 8px;border-radius:4px;text-transform:uppercase}
.picks-list{display:flex;flex-direction:column;gap:5px}
.picks-item{display:grid;grid-template-columns:52px 1fr 54px 54px;gap:6px;align-items:center;padding:8px 10px;border-radius:var(--radius-sm);transition:transform .15s}
.picks-item:hover{transform:translateX(2px)}
.theme-dark .picks-item{background:var(--bg-dark-card);border:1px solid var(--border-dark)}
.theme-light .picks-item{background:var(--bg-light-card);border:1px solid var(--border-light)}
.picks-ticker{font-size:.68rem;font-weight:800}
.theme-dark .picks-ticker{color:#fff}
.theme-light .picks-ticker{color:#0f172a}
.picks-info{overflow:hidden}
.picks-name{font-size:.48rem;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ══════ PARAMS ══════ */
  var params = new URLSearchParams(location.search);

  /* ══════ CACHE ══════ */
  function cacheGet(key) {
    try {
      var raw = sessionStorage.getItem('mwg_' + key);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (Date.now() - obj.ts > CACHE_TTL) { sessionStorage.removeItem('mwg_' + key); return null; }
      return obj.data;
    } catch(e) { return null; }
  }
  function cacheSet(key, data) {
    try { sessionStorage.setItem('mwg_' + key, JSON.stringify({ ts: Date.now(), data: data })); } catch(e) {}
  }

  /* ══════ YAHOO V8 — single symbol ══════ */
  function fetchWithTimeout(url, ms) {
    return new Promise(function(resolve, reject) {
      var timer = setTimeout(function() { reject(new Error('timeout')); }, ms);
      fetch(url).then(function(r) {
        clearTimeout(timer);
        resolve(r);
      }).catch(function(e) {
        clearTimeout(timer);
        reject(e);
      });
    });
  }

  function parseYahooResponse(wrapper, sym) {
    var yahoo = typeof wrapper.contents === 'string' ? JSON.parse(wrapper.contents) : wrapper;
    // codetabs proxy returns raw JSON (no wrapper)
    if (!yahoo.chart && wrapper.chart) yahoo = wrapper;
    var res = yahoo && yahoo.chart && yahoo.chart.result && yahoo.chart.result[0];
    if (!res || !res.meta) throw new Error('no data');

    var meta = res.meta;
    var price = meta.regularMarketPrice;
    var prevClose = meta.chartPreviousClose || meta.previousClose || price;
    var chg = price - prevClose;
    var chgPct = prevClose ? (chg / prevClose) * 100 : 0;

    return { price: price, chg: chg, chgPct: chgPct, prevClose: prevClose, name: meta.shortName || sym };
  }

  function fetchYahooOne(sym) {
    var cached = cacheGet('y_' + sym);
    if (cached) return Promise.resolve(cached);

    var yahooUrl = YAHOO_V8 + encodeURIComponent(sym) + '?interval=1d&range=2d';

    // Try primary proxy first, fallback to secondary
    function tryProxy(idx) {
      if (idx >= PROXY_URLS.length) return Promise.resolve(null);
      var url = PROXY_URLS[idx] + encodeURIComponent(yahooUrl);
      return fetchWithTimeout(url, 8000)
        .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(wrapper) {
          var result = parseYahooResponse(wrapper, sym);
          cacheSet('y_' + sym, result);
          return result;
        })
        .catch(function() { return tryProxy(idx + 1); });
    }

    return tryProxy(0);
  }

  /* ══════ BATCH FETCH with concurrency ══════ */
  function fetchBatch(symbols, fetchFn) {
    var results = {};
    var queue = symbols.slice();
    var inflight = 0;

    return new Promise(function(resolve) {
      function next() {
        if (queue.length === 0 && inflight === 0) return resolve(results);
        while (queue.length > 0 && inflight < MAX_CONCURRENT) {
          (function(sym) {
            inflight++;
            fetchFn(sym).then(function(data) {
              if (data) results[sym] = data;
            }).finally(function() {
              inflight--;
              next();
            });
          })(queue.shift());
        }
      }
      next();
    });
  }

  /* ══════ BINANCE ══════ */
  function fetchBinanceOne(sym) {
    var pair = sym.replace('-USD', 'USDT');
    var cached = cacheGet('bn_' + pair);
    if (cached) return Promise.resolve(cached);

    return fetch(BINANCE_API + '?symbol=' + pair, { signal: AbortSignal.timeout(8000) })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var result = {
          price: parseFloat(d.lastPrice),
          chg: parseFloat(d.priceChange),
          chgPct: parseFloat(d.priceChangePercent),
          name: sym
        };
        cacheSet('bn_' + pair, result);
        return result;
      })
      .catch(function() { return null; });
  }

  /* ══════ FETCH ALL — routes crypto to Binance, stocks to Yahoo ══════ */
  function fetchAll(symbolConfigs) {
    var stockSyms = [];
    var cryptoSyms = [];
    symbolConfigs.forEach(function(s) {
      if (s.type === 'crypto') cryptoSyms.push(s.sym);
      else stockSyms.push(s.sym);
    });

    return Promise.all([
      fetchBatch(stockSyms, fetchYahooOne),
      fetchBatch(cryptoSyms, fetchBinanceOne)
    ]).then(function(res) {
      var merged = {};
      Object.keys(res[0]).forEach(function(k) { merged[k] = res[0][k]; });
      Object.keys(res[1]).forEach(function(k) { merged[k] = res[1][k]; });
      return merged;
    });
  }

  /* ══════ UTILS ══════ */
  function fmt(n, dec) {
    if (n == null || isNaN(n)) return '--';
    dec = dec != null ? dec : 2;
    if (Math.abs(n) >= 10000) return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
    if (Math.abs(n) >= 1000) return n.toLocaleString('en-US', { maximumFractionDigits: dec });
    return n.toFixed(dec);
  }
  function fmtPct(n) {
    if (n == null || isNaN(n)) return '--';
    return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  }
  function chgClass(n) { return n > 0.01 ? 'up' : n < -0.01 ? 'down' : 'flat'; }
  function chgArrow(n) { return n > 0.01 ? '<i class="fas fa-caret-up"></i>' : n < -0.01 ? '<i class="fas fa-caret-down"></i>' : ''; }

  // Multi-factor regime: VIX (primary) + SPX % change + TLT % change
  // Score 0-1: >0.7 = Risk-Off, 0.5-0.7 = Early Risk-Off, 0.3-0.5 = Neutral, <0.3 = Risk-On
  function regimeFromData(allData) {
    var vixD = allData['^VIX'] || allData['%5EVIX'];
    var spyD = allData['SPY'];
    var tltD = allData['TLT'];

    var vix = vixD ? vixD.price : 20;
    var spyChg = spyD ? spyD.chgPct : 0;
    var tltChg = tltD ? tltD.chgPct : 0;

    // VIX score (0-1): <12=0, 15=0.2, 20=0.4, 25=0.6, 30=0.8, 35+=1
    var vixScore = Math.min(1, Math.max(0, (vix - 12) / 23));

    // SPX score (0-1): positive move = low risk, negative = high risk
    // -3% = 1.0, 0% = 0.3, +3% = 0
    var spxScore = Math.min(1, Math.max(0, 0.3 - spyChg * 0.23));

    // TLT score (0-1): TLT up = flight to safety = risk-off signal
    // +2% = 0.8, 0% = 0.3, -2% = 0
    var tltScore = Math.min(1, Math.max(0, 0.3 + tltChg * 0.25));

    // Weighted composite: VIX 50%, SPX 30%, TLT 20%
    var score = vixScore * 0.5 + spxScore * 0.3 + tltScore * 0.2;

    var regime;
    if (score >= 0.7) regime = { label: 'RISK-OFF', color: '#ef4444' };
    else if (score >= 0.5) regime = { label: 'EARLY RISK-OFF', color: '#f97316' };
    else if (score >= 0.3) regime = { label: 'NEUTRAL', color: '#f59e0b' };
    else regime = { label: 'RISK-ON', color: '#10b981' };

    regime.score = score;
    regime.vix = vix;
    regime.components = { vix: vixScore, spx: spxScore, tlt: tltScore };
    return regime;
  }

  // Fallback for when only VIX is available
  function regimeFromVix(vix) {
    return regimeFromData({ '^VIX': { price: vix, chgPct: 0 } });
  }

  function fearGreedFromVix(vix) {
    return Math.round(Math.max(0, Math.min(100, 100 - (vix - 10) * 3)));
  }

  function isMarketOpen() {
    var now = new Date();
    var utcH = now.getUTCHours();
    var utcM = now.getUTCMinutes();
    var day = now.getUTCDay();
    // US market: Mon-Fri, 13:30-20:00 UTC (9:30-16:00 ET)
    if (day === 0 || day === 6) return false;
    var mins = utcH * 60 + utcM;
    return mins >= 810 && mins <= 1200; // 13:30 to 20:00
  }

  function marketStatusHtml() {
    var open = isMarketOpen();
    return '<div class="market-status ' + (open ? 'open' : 'closed') + '"><span class="status-dot"></span> US Market ' + (open ? 'Open' : 'Closed — showing last close') + '</div>';
  }

      html += '</div></div>';
    });

    html += '</div>';
    html += '<div class="g-modal-overlay" id="embedModal"><div class="g-modal">';
    html += '<button class="g-modal-close" id="modalClose"><i class="fas fa-xmark"></i></button>';
    html += '<h3 id="modalTitle">Embed Widget</h3><p class="g-modal-sub">Copy the code below and paste it into your HTML.</p>';
    html += '<div class="g-modal-section"><h4><i class="fas fa-palette"></i> Theme</h4><div class="g-modal-opts" id="themeOpts">';
    html += '<div class="g-modal-opt active" data-val="dark"><i class="fas fa-moon"></i><span>Dark</span></div>';
    html += '<div class="g-modal-opt" data-val="light"><i class="fas fa-sun"></i><span>Light</span></div>';
    html += '</div></div>';
    html += '<div class="g-modal-section"><h4><i class="fas fa-code"></i> Embed Code</h4>';
    html += '<textarea class="g-embed-code" id="embedCode" rows="3" readonly></textarea></div>';
    html += '<button class="g-btn g-btn-primary" id="copyBtn" style="width:100%;justify-content:center"><i class="fas fa-copy"></i> Copy to Clipboard</button>';
    html += '</div></div>';
    html += '<div class="g-footer"><a href="/"><img src="/logo.svg" alt="MW"> dailytickers.com</a></div>';

    root.innerHTML = html;

    // Load live mini-previews (single batch fetch, no iframes)
    loadGalleryPreviews();

    // Modal logic
    var currentWidget = null;
    var currentTheme = 'dark';
    var sizes = { dashboard: [380, 420], sector: [380, 480], movers: [380, 400], picks: [380, 560], regime: [320, 220], crypto: [380, 520], proxy: [380, 540], regions: [380, 400], radar: [380, 420] };
    var names = { dashboard: 'Market Dashboard', sector: 'Sector Rotation', movers: 'Top Movers', picks: 'Scanner A+ Picks', regime: 'Market Regime', crypto: 'Crypto Live', proxy: 'High-Beta Proxies', regions: 'Regional Overview', radar: 'Risk Radar' };

    function updateCode() {
      var s = sizes[currentWidget] || [380, 400];
      var url = BASE_URL + '/widget/gallery.html?type=' + currentWidget + '&theme=' + currentTheme;
      document.getElementById('embedCode').value = '<iframe src="' + url + '" width="' + s[0] + '" height="' + s[1] + '" style="border:none;border-radius:12px;overflow:hidden" loading="lazy"></iframe>';
    }

    document.querySelectorAll('[data-embed]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentWidget = btn.dataset.embed;
        currentTheme = 'dark';
        document.getElementById('modalTitle').textContent = 'Embed ' + (names[currentWidget] || '');
        document.querySelectorAll('#themeOpts .g-modal-opt').forEach(function(o) { o.classList.toggle('active', o.dataset.val === 'dark'); });
        updateCode();
        document.getElementById('embedModal').classList.add('show');
      });
    });

    document.querySelectorAll('#themeOpts .g-modal-opt').forEach(function(opt) {
      opt.addEventListener('click', function() {
        document.querySelectorAll('#themeOpts .g-modal-opt').forEach(function(o) { o.classList.remove('active'); });
        opt.classList.add('active');
        currentTheme = opt.dataset.val;
        updateCode();
      });
    });

    document.getElementById('modalClose').addEventListener('click', function() {
      document.getElementById('embedModal').classList.remove('show');
    });
    document.getElementById('embedModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('show');
    });
    document.getElementById('copyBtn').addEventListener('click', function() {
      var ta = document.getElementById('embedCode');
      ta.select();
      document.execCommand('copy');
      this.innerHTML = '<i class="fas fa-check"></i> Copied!';
      var self = this;
      setTimeout(function() { self.innerHTML = '<i class="fas fa-copy"></i> Copy to Clipboard'; }, 2000);
    });
  }

  /* ══════ DASHBOARD ══════ */
  function renderDashboard() {
    document.body.className = 'widget-mode theme-' + theme;
    root.innerHTML = widgetShell('dash');
    loadDashboard();
  }

  function loadDashboard() {
    fetchAll(DASHBOARD_SYMBOLS).then(function(data) {
      var regime = regimeFromData(data);
      var vixVal = regime.vix;
      var fg = fearGreedFromVix(vixVal);

      var html = marketStatusHtml();
      html += '<div class="dash-grid">';
      html += '<div class="dash-regime"><div class="dash-regime-left">';
      html += '<div class="dash-regime-dot" style="background:' + regime.color + ';box-shadow:0 0 10px ' + regime.color + '"></div>';
      html += '<div><div class="dash-regime-label" style="color:' + regime.color + '">' + regime.label + '</div>';
      html += '<div class="dash-regime-sub">Fear & Greed: ' + fg + '/100</div></div></div>';
      html += '<div class="dash-regime-vix"><div class="dash-regime-vix-val" style="color:' + regime.color + '">' + fmt(vixVal, 1) + '</div><div class="dash-regime-vix-label">VIX</div></div></div>';

      DASHBOARD_SYMBOLS.forEach(function(s) {
        if (s.hidden) return;
        var d = data[s.sym];
        if (!d) {
          html += '<div class="dash-card"><div class="dash-label">' + s.label + '</div><div class="dash-price">--</div><div class="dash-chg flat">--</div></div>';
          return;
        }

  function fetchYahooScreener(scrId, count) {
    var cached = cacheGet('scr_' + scrId);
    if (cached) return Promise.resolve(cached);

    var url = YAHOO_SCREENER + 'scrIds=' + scrId + '&count=' + (count || 10);

    function tryProxy(idx) {
      if (idx >= PROXY_URLS.length) return Promise.resolve([]);
      var proxyUrl = PROXY_URLS[idx] + encodeURIComponent(url);
      return fetchWithTimeout(proxyUrl, 8000)
        .then(function(r) { return r.json(); })
        .then(function(wrapper) {
          var raw = typeof wrapper.contents === 'string' ? JSON.parse(wrapper.contents) : wrapper;
          var result = raw && raw.finance && raw.finance.result && raw.finance.result[0];
          var quotes = result && result.quotes ? result.quotes : [];
          var items = quotes.map(function(q) {
            return {
              sym: q.symbol,
              name: q.shortName || q.longName || q.symbol,
              price: q.regularMarketPrice || 0,
              chgPct: q.regularMarketChangePercent || 0,
              vol: q.regularMarketVolume || 0,
              mktCap: q.marketCap || 0
            };
          });
          if (items.length > 0) cacheSet('scr_' + scrId, items);
          return items;
        })
        .catch(function() { return tryProxy(idx + 1); });
    }

    return tryProxy(0);
  }

          h += '<div style="flex:1;background:#1e293b;border-radius:6px;padding:8px;text-align:center">';
          h += '<div style="font-size:.5rem;font-weight:800;color:#e2e8f0">' + c.l + '</div>';
          h += '<div style="font-size:.6rem;font-weight:800;color:#fff;font-family:Inter,monospace">$' + fmt(p, p > 100 ? 0 : 2) + '</div>';
          h += '<div style="font-size:.44rem;font-weight:700;color:' + (pct >= 0 ? '#10b981' : '#ef4444') + '">' + fmtPct(pct) + '</div></div>';
        });
        h += '</div>';
        h += '<div style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;font-size:.44rem;color:#10b981;font-weight:600"><span style="width:4px;height:4px;border-radius:50%;background:#10b981;animation:pulse-dot 2s infinite"></span> 24/7 via Binance</div>';
        el.innerHTML = h;
      }

      // Proxy preview
      el = document.getElementById('preview-proxy');
      if (el) {
        var proxies = [
          { l: 'NVDA', theme: 'AI', color: '#8b5cf6', d: data['NVDA'] },
          { l: 'BTC-USD', theme: 'BTC', color: '#f97316', d: data['BTC-USD'] },
        ];
        var h = '';
        proxies.forEach(function(p) {
          var pct = p.d ? p.d.chgPct : 0;
          h += '<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;background:#1e293b;border-radius:5px;margin-bottom:3px">';
          h += '<span style="font-size:.44rem;font-weight:800;color:' + p.color + ';background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px">' + p.theme + '</span>';
          h += '<span style="font-size:.52rem;font-weight:800;color:#e2e8f0">' + p.l + '</span>';
          h += '<span style="font-size:.46rem;font-weight:700;color:' + (pct >= 0 ? '#10b981' : '#ef4444') + ';margin-left:auto">' + fmtPct(pct) + '</span></div>';
        });
        el.innerHTML = h;
      }

      // Radar preview
      el = document.getElementById('preview-radar');
      if (el) {
        var top4 = (radar.items || []).sort(function(a, b) { return b.importance - a.importance; }).slice(0, 4);
        var catColors = { risk: '#ef4444', event: '#f59e0b', opportunity: '#10b981', regime: '#3b82f6' };
        var h = '';
        top4.forEach(function(item) {
          var c = catColors[item.category] || '#94a3b8';
          h += '<div style="display:flex;align-items:center;gap:6px;padding:4px 8px;background:#1e293b;border-radius:5px;margin-bottom:3px">';
          h += '<div style="width:6px;height:6px;border-radius:50%;background:' + c + ';flex-shrink:0;box-shadow:0 0 4px ' + c + '"></div>';
          h += '<span style="font-size:.48rem;font-weight:600;color:#e2e8f0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">' + item.label + '</span>';
          h += '<span style="font-size:.4rem;font-weight:700;color:' + c + ';text-transform:uppercase">' + (item.category || '').slice(0, 4) + '</span></div>';
        });
        el.innerHTML = h || '<div style="font-size:.48rem;color:#475569;text-align:center;padding:16px">No radar data</div>';
      }
    }).catch(function() {
      // Silently fail — previews stay in loading state
    });
  }

  /* ══════ RENDER: CRYPTO ══════ */
  function renderCrypto() {
    document.body.className = 'widget-mode theme-' + theme;
    root.innerHTML = widgetShell('crypto');
    loadCrypto();
  }

  function loadCrypto() {
    var promises = CRYPTO_PAIRS.map(function(c) {
      return fetch(BINANCE_API + '?symbol=' + c.sym, { signal: AbortSignal.timeout(8000) })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          return {
            sym: c.sym, label: c.label, name: c.name, featured: c.featured,
            price: parseFloat(d.lastPrice),
            chg: parseFloat(d.priceChange),
            chgPct: parseFloat(d.priceChangePercent),
            high: parseFloat(d.highPrice),
            low: parseFloat(d.lowPrice),
            vol: parseFloat(d.quoteVolume)
          };
        })
        .catch(function() { return null; });
    });

    Promise.all(promises).then(function(results) {
      var items = results.filter(function(r) { return r !== null; });
      var featured = items.filter(function(i) { return i.featured; });
      var rest = items.filter(function(i) { return !i.featured; });

      var html = '';
      // Featured (BTC, ETH) - full width
      featured.forEach(function(item) {
        var dec = item.price > 100 ? 2 : item.price > 1 ? 4 : 6;
        html += '<div class="crypto-card featured"><div style="flex:1">';
        html += '<div class="crypto-sym">' + item.label + ' <small>' + item.name + '</small></div>';
        html += '<div class="crypto-price">$' + fmt(item.price, dec) + '</div>';
        html += '<div class="crypto-chg ' + chgClass(item.chgPct) + '">' + chgArrow(item.chgPct) + ' ' + fmtPct(item.chgPct) + ' (24h)</div>';
        html += '</div><div style="text-align:right;font-size:.48rem;color:#64748b">';
        html += '<div>H: $' + fmt(item.high, dec) + '</div>';
        html += '<div>L: $' + fmt(item.low, dec) + '</div>';
        html += '<div>Vol: $' + (item.vol > 1e9 ? (item.vol / 1e9).toFixed(1) + 'B' : (item.vol / 1e6).toFixed(0) + 'M') + '</div>';
        html += '</div></div>';
      });

      // Grid for the rest
      html += '<div class="crypto-grid">';
      rest.forEach(function(item) {
        var dec = item.price > 100 ? 2 : item.price > 1 ? 4 : 6;
        html += '<div class="crypto-card">';
        html += '<div class="crypto-sym">' + item.label + ' <small>' + item.name + '</small></div>';
        html += '<div class="crypto-price">$' + fmt(item.price, dec) + '</div>';
        html += '<div class="crypto-chg ' + chgClass(item.chgPct) + '">' + chgArrow(item.chgPct) + ' ' + fmtPct(item.chgPct) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      html += '<div class="crypto-status"><span class="live-dot"></span> Live via Binance · 24/7</div>';

      document.getElementById('cryptoContent').innerHTML = html;
      stampUpdate('crypto');
      setTimeout(loadCrypto, 15000); // 15s refresh for crypto
    }).catch(function() {
      document.getElementById('cryptoContent').innerHTML = '<div class="w-error"><i class="fas fa-exclamation-triangle"></i> Unable to load crypto data.</div>';
      setTimeout(loadCrypto, 10000);
    });
  }

  /* ══════ RENDER: PROXY (High-Beta Themes) ══════ */
  function renderProxy() {
    document.body.className = 'widget-mode theme-' + theme;
    root.innerHTML = widgetShell('proxy');
    loadProxy();
  }

  function loadProxy() {
    var configs = PROXY_TICKERS.map(function(p) { return { sym: p.sym, type: 'stock' }; });
    fetchAll(configs).then(function(data) {
      var items = PROXY_TICKERS.map(function(p) {
        var d = data[p.sym];
        return {
          sym: p.sym, theme: p.theme, themeColor: p.themeColor, name: p.name,
          price: d ? d.price : 0, chgPct: d ? d.chgPct : 0, hasData: !!d
        };
      });

      var html = marketStatusHtml();
      html += '<div class="proxy-grid">';

      var lastTheme = '';
      items.forEach(function(item) {
        if (item.theme !== lastTheme) {
          lastTheme = item.theme;
        }
        html += '<div class="proxy-row">';
        html += '<div class="proxy-theme" style="color:' + item.themeColor + ';background:' + item.themeColor + '15">' + item.theme + '</div>';
        html += '<div class="proxy-ticker">' + item.sym + '</div>';
        html += '<div class="proxy-name">' + item.name + '</div>';
        html += '<div class="proxy-price">' + (item.hasData ? '$' + fmt(item.price, item.price > 100 ? 0 : 2) : '--') + '</div>';
        html += '<div class="proxy-pct ' + chgClass(item.chgPct) + '">' + (item.hasData ? fmtPct(item.chgPct) : '--') + '</div>';
        html += '</div>';
      });
      html += '</div>';

      document.getElementById('proxyContent').innerHTML = html;
      stampUpdate('proxy');
      setTimeout(loadProxy, REFRESH_INTERVAL);
    }).catch(function() {
      document.getElementById('proxyContent').innerHTML = '<div class="w-error"><i class="fas fa-exclamation-triangle"></i> Unable to load proxy data.</div>';
      setTimeout(loadProxy, 10000);
    });
  }

  /* ══════ RENDER: REGIONS ══════ */
  var REGIONS_SYMBOLS = [
    // US
    { sym: 'SPY', label: 'S&P 500', region: 'us', type: 'stock' },
    { sym: 'QQQ', label: 'Nasdaq 100', region: 'us', type: 'stock' },
    // Europe
    { sym: 'EWG', label: 'Germany (DAX)', region: 'eu', type: 'stock' },
    { sym: 'EWQ', label: 'France (CAC)', region: 'eu', type: 'stock' },
    // Asia-Pacific
    { sym: 'EWJ', label: 'Japan (Nikkei)', region: 'ap', type: 'stock' },
    { sym: 'FXI', label: 'China (CSI 300)', region: 'ap', type: 'stock' },
    // Crypto
    { sym: 'BTC-USD', label: 'Bitcoin', region: 'crypto', type: 'crypto' },
    { sym: 'ETH-USD', label: 'Ethereum', region: 'crypto', type: 'crypto' },
  ];

  function renderRegions() {
    document.body.className = 'widget-mode theme-' + theme;
    root.innerHTML = widgetShell('regions');
    loadRegions();
  }

  function loadRegions() {
    fetchAll(REGIONS_SYMBOLS).then(function(data) {
      var regionMeta = {
        us:     { label: 'United States',   icon: 'fa-flag-usa',       color: '#3b82f6' },
        eu:     { label: 'Europe',          icon: 'fa-earth-europe',   color: '#8b5cf6' },
        ap:     { label: 'Asia-Pacific',    icon: 'fa-earth-asia',     color: '#f59e0b' },
        crypto: { label: 'Crypto',          icon: 'fa-coins',          color: '#f97316' },
      };

      var html = marketStatusHtml();
      ['us', 'eu', 'ap', 'crypto'].forEach(function(region) {
        var meta = regionMeta[region];
        var items = REGIONS_SYMBOLS.filter(function(s) { return s.region === region; });

        html += '<div class="regions-section">';
        html += '<div class="regions-title" style="color:' + meta.color + '"><i class="fas ' + meta.icon + '"></i> ' + meta.label + '</div>';
        html += '<div class="regions-row">';
        items.forEach(function(s) {
          var d = data[s.sym];
          var price = d ? d.price : 0;
          var pct = d ? d.chgPct : 0;
          var dec = price > 1000 ? 0 : price > 100 ? 1 : 2;
          html += '<div class="regions-item">';
          html += '<div class="regions-sym">' + s.label + '</div>';
          html += '<div class="regions-val">' + (d ? '$' + fmt(price, dec) : '--') + '</div>';
          html += '<div class="regions-chg ' + chgClass(pct) + '">' + (d ? chgArrow(pct) + ' ' + fmtPct(pct) : '--') + '</div>';
          html += '</div>';
        });
        html += '</div></div>';
      });

      document.getElementById('regionsContent').innerHTML = html;
      stampUpdate('regions');
      setTimeout(loadRegions, REFRESH_INTERVAL);
    }).catch(function() {
      document.getElementById('regionsContent').innerHTML = '<div class="w-error"><i class="fas fa-exclamation-triangle"></i> Unable to load regional data.</div>';
      setTimeout(loadRegions, 10000);
    });
  }

  /* ══════ ROUTER ══════ */
  switch (widgetType) {
    case 'dashboard': renderDashboard(); break;
    case 'sector':    renderSector(); break;
    case 'movers':    renderMovers(); break;
    case 'picks':     renderPicks(); break;
    case 'regime':    renderRegime(); break;
    case 'crypto':    renderCrypto(); break;
    case 'proxy':     renderProxy(); break;
    case 'regions':   renderRegions(); break;
    case 'radar':     renderRadar(); break;
    default:          renderGallery(); break;
  }

})();
</script>
</body>
</html>
